# Giriş: e-posta + parola. Kimlik bilgileri ortamdan gelir:
#   maestro test -e MAESTRO_EMAIL=... -e MAESTRO_PASSWORD=... .maestro
appId: app.hakan.mukellef
name: login
tags: [smoke]
---
- launchApp:
    clearState: true
- assertVisible: "Giriş yap"
# Ekran görüntüleri (#332): CI'da maestro-<uygulama> artefaktının screenshots/ klasörü.
- takeScreenshot: mukellef-giris
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "Giriş yap"
- extendedWaitUntil:
    visible:
      text: "Şirket seçin|Merhaba.*|Fişi çek, gerisini düşünme"
    timeout: 20000
