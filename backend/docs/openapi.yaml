          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerConsentOutcome"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`INVITATION_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/onboarding-requests/{uuid}/reject:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [TaxpayerOnboarding]
      operationId: rejectTaxpayerOnboardingRequest
