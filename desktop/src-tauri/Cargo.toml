[package]
name = "hakan-desktop"
version = "0.1.0"
description = "HAKAN masaüstü kabuğu (Tauri v2); iş mantığı Go sidecar'da"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "hakan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
log = "0.4"

[dev-dependencies]
# Güncelleyici uçtan uca testi (#205): sahte Tauri uygulaması, geçici
# minisign anahtar çifti.
tauri = { version = "2", features = ["tray-icon", "test"] }
minisign = "0.7"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
