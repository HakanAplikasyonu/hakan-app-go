          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/{uuid}/read:
    post:
      tags: [Notifications]
      operationId: postNotificationRead
      summary: Mark notification read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get own preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      summary: Update own preferences
      description: |
        Security emails (password reset / email verification) ignore `email_enabled`.
        Web push requires `push_enabled` and an active browser subscription; it follows in-app delivery.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/push-devices:
    post:
      tags: [Notifications]
      operationId: registerPushDevice
      summary: Register a mobile push device (Expo)
      description: |
        Upserts the caller's Expo push token (call after login and on app start).
        The token is unique: a token already registered by another account on the
        same phone moves to the caller. Refreshes `locale`, `app_version`,
        `device_name` and `last_seen_at`, and re-enables a token that Expo had
        reported as `DeviceNotRegistered`.

        Devices are **user-level**: every in-app
        notification of the user is mirrored as a push to all active devices,
        in addition to browser Web Push. The first registration creates the
        user's preference row with `push_enabled=true`; an existing preference
        is left untouched and returned as `push_enabled` (toggle it with
        `PUT /v1/notification-preferences`).

        Push payload (Expo message) — lock-screen safe (fixed texts per
        notification kind, only whitelisted variables); rendered in the user's locale (`users.locale`,
        falling back to the device `locale`):
        `{ "title": "...", "body": "...", "sound": "default", "priority": "high",
        "data": { "url": "/platform/exports/{uuid}", "notification_uuid": "uuid", "kind": "exports.ready" } }`.
        `data.url` is the same relative web path the in-app notification links to
        (omitted when the notification has no link); `kind` is the
        notification kind or template code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDeviceRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/push-devices/{token}:
    delete:
      tags: [Notifications]
      operationId: deletePushDevice
      summary: Unregister a mobile push device
      description: |
        Removes the caller's device (call on logout, before dropping the access
        token). The token must be URL-encoded (`ExponentPushToken%5B...%5D`).
        Idempotent: unknown tokens or tokens of another user return 200 and
        change nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Expo push token, URL-encoded
          schema: { type: string, example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]" }
      responses:
        "200":
          description: Removed (or nothing to remove)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatusOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/platform/notifications:
    get:
      tags: [Platform]
      operationId: getPlatformNotifications
      summary: List platform notifications
      description: |
        Defaults to the caller's own notifications (`scope=me`).
        `platform.notifications.read_all` is required for `scope=all` or `user_uuid`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: "me (default) or all (requires read_all)"
          schema:
            type: string
            enum: [me, all]
        - name: user_uuid
          in: query
          description: "Filter to one user (requires read_all)"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notifications/meta:
    get:
      tags: [Platform]
      operationId: getPlatformNotificationsMeta
      summary: Platform notifications meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/app/config:
    get:
      tags: [Health]
      operationId: getAppConfig
      summary: Public app config
      description: >-
        Unauthenticated bootstrap payload (auth methods, branding, and
        `tenancy: {enabled, self_serve}` reflecting `TENANCY_ENABLED` /
        `TENANCY_SELF_SERVE`).
      security: []
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listAuthSessions
      summary: List active sessions
      description: Refresh-token sessions for the current user. `current` is the session bound to this access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      operationId: revokeOtherAuthSessions
      summary: Revoke other sessions
      description: Signs out every session except the current one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remaining current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions/{uuid}:
    delete:
      tags: [Auth]
      operationId: revokeAuthSession
      summary: Revoke a session
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/context:
    get:
      tags: [Tenant]
      operationId: getTenantContext
      summary: Current organization scope
      description: |
        Resolves the organization named by `X-Organization` and the caller's
        membership in it, and returns what tenant routes see: the organization,
        the caller's tenant role and its `tenant.*` permissions in this
        organization only. Mounted only when `TENANCY_ENABLED=true`.

        Errors: missing header → `400 ORGANIZATION_REQUIRED`; unknown
        organization or no membership → `403 NO_TENANT_MEMBERSHIP` (same
        answer for both; `super_admin` is not exempt); suspended →
        `403 ORGANIZATION_SUSPENDED`; outside the access window →
        `403 ORGANIZATION_ACCESS_EXPIRED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Organization scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantContext"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/roles:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Tenant]
      operationId: getTenantRoles
      summary: Roles of the organization
      description: |
        Requires `tenant.roles.read`. Every office gets copies of the template
        roles (owner, admin, accountant, member, intern) when it is created
        (D16); they are `is_system` and cannot be deleted. Custom roles are
        office-specific and grant permissions only in this organization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantRoleList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantRole
      summary: Create an office role
      description: |
        Requires `tenant.roles.write`. `key` is lowercase letters, digits and
        `_` (2-32, starting with a letter), unique in the organization and not
        a template key. `permissions` must be `tenant.*` slugs from
        `GET /v1/tenant/role-permissions`. A caller who is not the owner may
        only use permissions it holds itself (`403 PERMISSION_ESCALATION`).
        Bumps the organization's cache version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRoleRequest"
      responses:
        "201":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantRole"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/roles/{roleKey}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - name: roleKey
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    patch:
      tags: [Tenant]
      operationId: patchTenantRole
      summary: Update an office role
      description: |
        Requires `tenant.roles.write`. Name, description and permissions of
        system and custom roles can change; the `owner` role always keeps every
        tenant permission (its permissions cannot be edited). A caller who is
        not the owner may only add permissions it holds itself; permissions
        the role already has may stay or be removed (`403
        PERMISSION_ESCALATION`). Bumps the organization's cache version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantRoleRequest"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantRole"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantRole
      summary: Delete a custom office role
      description: |
        Requires `tenant.roles.write`. System roles cannot be deleted
        (`409 ROLE_IS_SYSTEM`); a role held by a member or an open invitation
        cannot be deleted (`409 ROLE_IN_USE`).
      security:
        - bearerAuth: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/role-permissions:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Tenant]
      operationId: getTenantRolePermissions
      summary: Permissions an office role can grant
      description: Requires `tenant.roles.read`. Every `tenant.*` permission.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantPermissionList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/members:
    get:
      tags: [Tenant]
      operationId: listTenantMembers
      summary: Members of the current organization
      description: Requires `tenant.members.read` in the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Member page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationMemberPage"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/members/{userUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - name: userUuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Tenant]
      operationId: changeTenantMemberRole
      summary: Change a member's role
      description: |
        Requires `tenant.members.write`. Only an owner may grant or take away
        the owner role (`403 OWNER_ROLE_REQUIRED`); the last owner cannot be
        demoted (`409 LAST_ORGANIZATION_OWNER`). A caller who is not the owner
        may only give a role whose permissions it holds itself (`403
        PERMISSION_ESCALATION`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrganizationMemberRoleRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Tenant]
      operationId: removeTenantMember
      summary: Remove a member
      description: |
        Requires `tenant.members.write`. Removing an owner needs the owner role
        (`403 OWNER_ROLE_REQUIRED`); the last owner cannot be removed
        (`409 LAST_ORGANIZATION_OWNER`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/taxpayer-requests:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [TaxpayerOnboarding]
      operationId: getTenantTaxpayerRequests
      summary: The office's add-mükellef requests
      description: |
        Requires `tenant.engagements.read`. Shows only what the office entered
        and the request status. `engagement_uuid` is set once the mükellef
        approved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerRequestPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [TaxpayerOnboarding]
      operationId: postTenantTaxpayerRequest
      summary: Add a mükellef (sends a consent request)
      description: |
        Requires `tenant.engagements.write`. Validates the VKN/TCKN offline
        (format and check digit) and emails a consent link to
        `contact_email`. **The answer never depends on whether the tax id is
        already on the platform** (D1b): same status (`202`), same body shape
        (`status: consent_requested`, echo of what the office sent) and a
        response time padded to a fixed minimum. The platform's taxpayer
        records are not read at all here. The engagement opens only when the
        mükellef approves. Rate limited per office.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxpayerRequestRequest"
      responses:
        "202":
          description: Consent requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerRequestAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/taxpayer-requests/{uuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/ResourceUUID"
    delete:
      tags: [TaxpayerOnboarding]
      operationId: deleteTenantTaxpayerRequest
      summary: Cancel a pending request
      description: Requires `tenant.engagements.write`.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements:
    get:
      tags: [Engagements]
      operationId: listTenantEngagements
      summary: Engagements the caller may see
      description: |
        Requires `tenant.engagements.read`. With `tenant.engagements.read_all`
        every engagement of the office is listed; otherwise only those the
        caller is assigned to.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, ended] }
      responses:
        "200":
          description: Engagement page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagementPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Engagements]
      operationId: getTenantEngagement
      summary: One engagement (active or ended)
      description: Requires `tenant.engagements.read` and an assignment or `tenant.engagements.read_all`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagement"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/context:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Engagements]
      operationId: getTenantEngagementContext
      summary: Resolved engagement scope (active engagements only)
      description: |
        The access rule every mükellef data route follows: an active
        engagement, plus an assignment or `tenant.engagements.read_all`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Engagement scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagementContext"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/taxpayer:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Taxpayers]
      operationId: getTenantEngagementTaxpayer
      summary: Taxpayer identity of an active engagement
      description: |
        Follows the taxpayer access rule (docs/01 §2.3): only through an
        active engagement of this office, to an assigned member or one with
        `tenant.engagements.read_all`. Once the engagement ends the office
        gets `403`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Taxpayer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayer"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/invitations:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [TaxpayerPortal]
      operationId: getTenantEngagementInvitations
      summary: Mükellef invitations of an engagement
      description: Requires `tenant.engagements.read` and access to an active engagement. Newest first, at most 100.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerInvitationList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [TaxpayerPortal]
      operationId: postTenantEngagementInvitation
      summary: Invite a mükellef user
      description: |
        D15: a mükellef user joins only by an office invitation. Requires
        `tenant.engagements.write` and access to an active engagement. An
        open invitation to the same address on this engagement is replaced.
        The email links to `/invite/m/{token}`; only the token hash is stored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxpayerInvitationRequest"
      responses:
        "201":
          description: Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/invitations/{uuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/ResourceUUID"
    delete:
      tags: [TaxpayerPortal]
      operationId: deleteTenantEngagementInvitation
      summary: Revoke a mükellef invitation
      description: Requires `tenant.engagements.write`.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404":
          description: "`INVITATION_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/documents:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [OfficeTransfer]
      operationId: getTenantEngagementDocuments
      summary: Documents (invoices) the engagement may see
      description: |
        Requires `tenant.engagements.read`. Runs under Postgres RLS. An
        engagement sees documents dated in its own period; documents from
        before it started only with the mükellef's history consent (or when
        the company never had another office); nothing dated on or after it
        ended. An ended engagement is readable only while its archive window
        is open (`engagement_archive_days` in the office settings, default 0).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagementDocumentList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/history-shares:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [OfficeTransfer]
      operationId: getTenantEngagementHistoryShares
      summary: History consents granted to this engagement
      description: Requires `tenant.engagements.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHistoryShareList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/petition-templates:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Petitions]
      operationId: getTenantPetitionTemplates
      summary: Petition templates
      description: Requires `tenant.engagements.read`. `draft_notice` is the text printed on draft petitions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePetitionTemplateList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/engagements/{engagementUuid}/petitions/preview:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [Petitions]
      operationId: previewTenantPetition
      summary: Preview a petition (nothing is stored)
      description: |
        Requires `tenant.engagements.read` and an active engagement. The
        mükellef (title, VKN/TCKN, vergi dairesi), the office name and the
        signer (user name, SMMM oda sicil no) are filled in from the
        engagement and the caller; `fields` are the template's own fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionRequest"
      responses:
        "200":
          description: Rendered petition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRenderedPetition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }

  /v1/tenant/engagements/{engagementUuid}/petitions:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Petitions]
      operationId: getTenantPetitions
      summary: Petitions of the engagement
      description: Requires `tenant.engagements.read`. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Petitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePetitionList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
    post:
      tags: [Petitions]
      operationId: postTenantPetition
      summary: Create a petition
      description: Requires `tenant.engagements.write`. Stores the exact text, template key and version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionRequest"
      responses:
        "201":
          description: Petition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePetition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }

  /v1/tenant/engagements/{engagementUuid}/petitions/{uuid}/pdf:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Petitions]
      operationId: getTenantPetitionPdf
      summary: Petition as PDF (A4)
      description: Requires `tenant.engagements.read`. Drafts carry the draft notice at the top and bottom.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/engagements/{engagementUuid}/end:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [Engagements]
      operationId: endTenantEngagement
      summary: End an engagement
      description: Requires `tenant.engagements.write`. Already ended → `409 ENGAGEMENT_ENDED`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ended engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagement"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/assignments:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Engagements]
      operationId: listTenantEngagementAssignments
      summary: Members assigned to an engagement
      description: Requires `tenant.engagements.read` and access to the engagement.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEngagementAssignmentList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/assignments/{userUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - name: userUuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Engagements]
      operationId: assignTenantEngagementMember
      summary: Assign an office member (idempotent)
      description: Requires `tenant.engagements.write` and an active engagement. The user must be a member of the office.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Engagements]
      operationId: unassignTenantEngagementMember
      summary: Remove a member's assignment
      description: Requires `tenant.engagements.write`.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Unassigned }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/leave:
    post:
      tags: [Tenant]
      operationId: leaveTenant
      summary: Leave the current organization
      description: Any member may leave; the last owner is refused (`409 LAST_ORGANIZATION_OWNER`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/invitations:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Tenant]
      operationId: listTenantInvitations
      summary: Open invitations of the current organization
      description: Pending and expired (not accepted, not revoked). Requires `tenant.members.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantInvitationPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: createTenantInvitation
      summary: Invite someone by email
      description: |
        Requires `tenant.members.write`. Stores the invitation (only a hash of
        its token) and enqueues an email with a single-use `/invite/{token}`
        link valid for `TENANCY_INVITE_TTL`. A new invitation replaces older
        open ones for the same address. Inviting as owner needs the owner role
        (`403 OWNER_ROLE_REQUIRED`); a caller who is not the owner may only
        invite with a role whose permissions it holds itself (`403
        PERMISSION_ESCALATION`); an address that already belongs to a
        member gets `409 ALREADY_MEMBER`. Rate limited per organization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInvitationRequest"
      responses:
        "201":
          description: Invitation created and email enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/invitations/{uuid}:
    delete:
      tags: [Tenant]
      operationId: revokeTenantInvitation
      summary: Revoke an open invitation
      description: Requires `tenant.members.write`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404":
          description: "`INVITATION_NOT_FOUND`: unknown, already used or already revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/settings:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Tenant]
      operationId: getTenantSettings
      summary: Current organization's settings
      description: Requires `tenant.settings.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantSettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Tenant]
      operationId: patchTenantSettings
      summary: Update name and app-defined settings
      description: |
        Requires `tenant.settings.write`. `settings` replaces the stored object
        (JSON object, at most 16 KiB). The slug is platform-managed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/ai/usage:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [AI]
      operationId: getTenantAIUsage
      summary: Office AI cost report
      description: |
        Requires `tenant.ai.usage.read`. One row per month x taxpayer x model
        for calls billed to the current organization. Dates are office-local
        (Europe/Istanbul); `to` is inclusive; the range is 1-366 days and
        defaults to the current month. `cost_usd` is an estimate from the model
        price table; calls to models without a known price are counted in
        `unpriced_calls` and add nothing to the cost.
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Cost report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIUsageReport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/ai/privacy:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [AI]
      operationId: getTenantAIPrivacy
      summary: AI data-handling statement
      description: |
        Requires `tenant.settings.read`. Which providers are configured, whether
        identifiers are masked before leaving the server, and whether each
        provider is bound not to train on the data (and on what basis).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Privacy statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIPrivacy"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/warning-rules:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Warnings]
      operationId: listOfficeWarningRules
      summary: Warning rule configuration (office)
      description: |
        Requires `tenant.warnings.read`. Every warning code (05-uyari-kodlari.md)
        with its catalog default, the office override
        and the effective configuration for the office. Resolution order:
        engagement > office > catalog default; params merge key by key.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningRuleList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/warning-rules/{code}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z0-9_]+$" } }
    put:
      tags: [Warnings]
      operationId: setOfficeWarningRule
      summary: Override a warning rule (office)
      description: |
        Requires `tenant.warning_rules.write`. Null / omitted fields inherit
        from the level below. `params` keys must exist in the code's default
        params; values are decimal strings, numbers or null (null = threshold
        not set: the check does not run).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Warnings]
      operationId: resetOfficeWarningRule
      summary: Remove a warning rule override (office)
      description: Requires `tenant.warning_rules.write`. 404 when there is no override.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Override removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/engagements/{engagementUuid}/warning-rules:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Warnings]
      operationId: listEngagementWarningRules
      summary: Warning rule configuration (engagement)
      description: |
        Requires `tenant.warnings.read`. Every warning code (05-uyari-kodlari.md)
        with its catalog default, the office override, the engagement override
        and the effective configuration for one engagement (taxpayer); requires `tenant.engagements.read` and engagement access as well. Resolution order:
        engagement > office > catalog default; params merge key by key.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningRuleList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/engagements/{engagementUuid}/warning-rules/{code}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z0-9_]+$" } }
    put:
      tags: [Warnings]
      operationId: setEngagementWarningRule
      summary: Override a warning rule (engagement)
      description: |
        Requires `tenant.warning_rules.write`. Null / omitted fields inherit
        from the level below. `params` keys must exist in the code's default
        params; values are decimal strings, numbers or null (null = threshold
        not set: the check does not run).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Warnings]
      operationId: resetEngagementWarningRule
      summary: Remove a warning rule override (engagement)
      description: Requires `tenant.warning_rules.write`. 404 when there is no override.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Override removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
