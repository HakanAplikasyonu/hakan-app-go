    get:
      tags: [Legal]
      operationId: getLegalDocument
      summary: A legal text
      description: |
        Public. Current published version, or `version` (published or retired: what someone accepted). Drafts are never public.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [privacy_notice, history_share_consent, data_processing_agreement, retention_policy] } }
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [tr, en] }, description: "Falls back to Accept-Language, then Turkish (the binding text)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalDocument"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/legal-acceptances:
    get:
      tags: [Legal]
      operationId: listMyLegalAcceptances
      summary: My consents and acknowledgements
      description: |
        Every legal text the caller accepted, in which flow, on whose behalf, and whether it was withdrawn (KVKK md. 11).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalAcceptanceList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Legal]
      operationId: acceptLegalDocument
      summary: Acknowledge a text
      description: |
        The caller acknowledges the current version of the privacy notice or retention policy for themselves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, version]
              properties:
                kind: { type: string, enum: [privacy_notice, retention_policy] }
                version: { type: integer, minimum: 1 }
                language: { type: string, enum: [tr, en] }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalAcceptance"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/legal/dpa:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Legal]
      operationId: getOfficeDPA
      summary: Data processing agreement status
      description: |
        Requires `tenant.settings.read`. The current agreement and whether the office accepted it (`up_to_date` is false after a new version).
      security:
        - bearerAuth: []
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string, enum: [tr, en] }, description: "Falls back to Accept-Language, then Turkish (the binding text)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOfficeDPAStatus"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/legal/dpa/accept:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    post:
      tags: [Legal]
      operationId: acceptOfficeDPA
      summary: Accept the data processing agreement
      description: |
        Requires `tenant.legal.accept` (owner, admin). Records the acceptance of the current version on behalf of the office (KVKK md. 12/2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                language: { type: string, enum: [tr, en] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOfficeDPAStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/platform/legal/documents:
    get:
      tags: [Legal]
      operationId: listAllLegalDocuments
      summary: All legal text versions
      description: |
        Requires `platform.legal.manage`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalDocumentList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Legal]
      operationId: createLegalDocumentDraft
      summary: New draft version
      description: |
        Requires `platform.legal.manage`. The next version number of the kind and language, as a draft.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, language, title, body]
              properties:
                kind: { type: string, enum: [privacy_notice, history_share_consent, data_processing_agreement, retention_policy] }
                language: { type: string, enum: [tr, en] }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 100000, description: Markdown }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalDocument"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/platform/legal/documents/{documentUuid}/publish:
    parameters:
      - { name: documentUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Legal]
      operationId: publishLegalDocument
      summary: Publish a draft
      description: |
        Requires `platform.legal.manage`. The draft becomes current; older published versions are retired. A published text never changes (a correction is a new version); flows then ask for the new version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_reviewed: { type: boolean, description: "true clears legal_review_pending" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalDocument"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/invitations/preview:
    post:
      tags: [Tenant]
      operationId: previewInvitation
      summary: Describe an invitation link
      description: |
        Public: the token is the credential, so it travels in the body (never
        in the URL). Returns the organization, invited address, role and
        status (`pending`, `expired`, `accepted`, `revoked`). Rate limited per
        client IP. Mounted only when `TENANCY_ENABLED=true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitationPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: "`INVITATION_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invitations/accept:
    post:
      tags: [Tenant]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Creates the membership for the signed-in user with the invited role and
        consumes the invitation (single use). The account email must be the
        invited address (`403 INVITATION_EMAIL_MISMATCH`); already a member →
        `409 ALREADY_MEMBER` (the invitation is kept); used, revoked or expired
        → `410 INVITATION_UNAVAILABLE`. Refused while impersonating. Rate
        limited per client IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAcceptedInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`INVITATION_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: "`INVITATION_UNAVAILABLE`: already used, revoked or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/ubl-uploads:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [Invoices]
      operationId: uploadTenantUBLInvoices
      summary: Upload UBL-TR XML / ZIP invoices
      description: |
        Requires `tenant.invoices.write` and an active engagement. Accepts a
        single UBL-TR XML, a ZIP of XML files, base64 text or a GİB envelope
        (max 200 MB). The file is processed in the background: XSD, GİB
        Schematron (failure → `UBL_SCHEMATRON_FAIL` warning, invoice kept),
        mapping to the common model and duplicate check by ETTN. Poll the job
        for its report.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Job accepted (status `queued`, or `done` when processed inline)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUBLUploadJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "413":
          description: File too large (`UPLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not XML, ZIP or base64 (`UNSUPPORTED_FILE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Invoices]
      operationId: listTenantUBLUploads
      summary: List UBL upload jobs (newest first, without item details)
      description: Requires `tenant.invoices.read` and an active engagement.
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUBLUploadJobList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/ubl-uploads/{jobUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: jobUuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Invoices]
      operationId: getTenantUBLUpload
      summary: Get a UBL upload job with its report
      description: Requires `tenant.invoices.read` and an active engagement.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job and report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUBLUploadJob"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/invoices:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Invoices]
      operationId: listEngagementInvoices
      summary: Invoices of the engagement's taxpayer (office panel)
      description: |
        Requires `tenant.invoices.read` and engagement access. Only invoices the
        office may see are listed: its own period plus whatever the taxpayer
        shared from before it (issue #8). Newest first.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [outgoing, incoming] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Invoice page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOfficeInvoicePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/invoices/{invoiceUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: invoiceUuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Invoices]
      operationId: getEngagementInvoice
      summary: One invoice with lines, KDV summary, sources and warnings
      description: Requires `tenant.invoices.read` and engagement access. 404 when the office may not see the invoice.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOfficeInvoiceDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/invoices/{invoiceUuid}/ubl:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: invoiceUuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Invoices]
      operationId: getEngagementInvoiceUBL
      summary: The stored UBL-TR XML of the invoice (for the preview)
      description: Requires `tenant.invoices.read` and engagement access. 404 when no UBL is stored.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: UBL-TR XML
          content:
            application/xml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/export-drivers:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Journals]
      operationId: listExportDrivers
      summary: Accounting program export drivers (Luca, Zirve, Excel)
      description: Requires `tenant.journals.read`. `verified=false` means the template was not checked against a real file of the program.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Drivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportDriverList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/engagements/{engagementUuid}/journal-drafts:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Journals]
      operationId: listJournalDrafts
      summary: Journal drafts (yevmiye taslağı) of the engagement
      description: Requires `tenant.journals.read`. Newest period first.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, approved, exported] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Draft page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalDraftPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Journals]
      operationId: createJournalDraft
      summary: Create a journal draft
      description: |
        Requires `tenant.journals.write`. The entry number is the next one in
        the engagement and period (`entry_date` month). Each line has an
        account and exactly one of debit / credit. Balance is checked at
        approval.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalDraftInput" }
      responses:
        "201":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalDraft"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/journal-drafts/{draftUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: draftUuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Journals]
      operationId: getJournalDraft
      summary: One journal draft with its lines
      description: Requires `tenant.journals.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalDraftDetail"
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/journal-drafts/{draftUuid}/approve:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: draftUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Journals]
      operationId: approveJournalDraft
      summary: Approve a balanced draft
      description: Requires `tenant.journals.write`. An unbalanced draft is refused with `422 JOURNAL_UNBALANCED`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Approved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalDraftDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Not balanced (`JOURNAL_UNBALANCED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/journal-drafts/{draftUuid}/reverse:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: draftUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Journals]
      operationId: reverseJournalDraftExport
      summary: Take an exported draft out of its export (ters kayıt)
      description: |
        Requires `tenant.journals.export`. Who, when and why are recorded on
        the export; the draft is approved again and can be exported again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Draft (approved again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalDraftDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/journal-exports:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Journals]
      operationId: listJournalExports
      summary: Exports (export batches) of the engagement, newest first
      description: Requires `tenant.journals.read`.
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Exports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJournalExportList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Journals]
      operationId: createJournalExport
      summary: Export approved drafts to an accounting program file
      description: |
        Requires `tenant.journals.export`. Give a `period` (every approved
        draft of it) or explicit `drafts`. The driver validates first; a
        blocker stops the export with `422 EXPORT_BLOCKED`, each issue in
        `error.details` (`code`, `field` = `entry:<no>[/line:<n>]`, `message` =
        issue params as JSON). A draft can be in one live export only
        (`409 ALREADY_EXPORTED`) until it is reversed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
