      operationId: listOfficeWarnings
      summary: Data warnings of the office
      description: |
        Requires `tenant.warnings.read`. Without `tenant.engagements.read_all`
        only engagements assigned to the caller are listed. Ordered blocker,
        warning, info, then most recently updated.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { $ref: "#/components/schemas/WarningSeverity" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, acknowledged, resolved, auto_resolved] } }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDataWarningPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/engagements/{engagementUuid}/warnings:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Warnings]
      operationId: listEngagementWarnings
      summary: Data warnings of one engagement
      description: Requires `tenant.warnings.read`, `tenant.engagements.read` and engagement access.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { $ref: "#/components/schemas/WarningSeverity" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, acknowledged, resolved, auto_resolved] } }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDataWarningPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/engagements/{engagementUuid}/warnings/{warningUuid}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: warningUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Warnings]
      operationId: acknowledgeEngagementWarning
      summary: Mark an open warning acknowledged
      description: |
        Requires `tenant.warnings.write` and engagement access. Only an open
        warning can be decided; the decision (who, when) is stored on the row.
        A later sync with the same condition does not reopen it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningDecision"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/engagements/{engagementUuid}/warnings/{warningUuid}/resolve:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: warningUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Warnings]
      operationId: resolveEngagementWarning
      summary: Mark an open warning resolved
      description: |
        Requires `tenant.warnings.write` and engagement access. Only an open
        warning can be decided; the decision (who, when) is stored on the row.
        A later sync with the same condition does not reopen it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarningDecision"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/taxpayer-consents/preview:
    post:
      tags: [TaxpayerOnboarding]
      operationId: previewTaxpayerConsent
      summary: Describe a consent link
      description: Public; the token travels in the body. Rate limited per client IP.
      security: []
