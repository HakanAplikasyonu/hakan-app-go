  /v1/tenant/engagements/{engagementUuid}/receipts:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [Receipts]
      operationId: captureReceipt
      summary: Capture a receipt photo
      description: |
        Requires `tenant.receipts.write`, `tenant.engagements.read` and engagement access. JPEG/PNG/WebP/GIF up to 10 MB. The AI reads date, VKN, amounts, KDV, plate (per-field confidence) into an expense draft (Z report: retail_sale draft) with approval_status=pending and the photo attached. The same photo, or the same vendor + date + amount, returns status=duplicate without a new draft (the same photo makes no AI call). Fields under 0.80 confidence go to the review queue (kind receipt_field); a plate not on the vehicle list raises PLATE_NOT_REGISTERED. When the AI read fails the capture is stored with status=failed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                kind: { type: string, enum: [expense_receipt, fuel_receipt, z_report] }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReceiptCapture"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Receipts]
      operationId: listReceiptCaptures
      summary: Receipt captures
      description: |
        Requires `tenant.receipts.read`.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, duplicate, failed, approved, rejected] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
