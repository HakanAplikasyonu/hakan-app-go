        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Consent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerConsentPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer-consents/approve:
    post:
      tags: [TaxpayerOnboarding]
      operationId: approveTaxpayerConsent
      summary: Approve an office's add-mükellef request
      description: |
        The signed-in account's email must be the request's `contact_email`
        (new users sign up with the token first). Outcomes:
        `approved` (the engagement is open; if the mükellef was with another
        office, that engagement ends: office change, D2) and the user is an
        owner of the company (`taxpayer_uuid`); or `forwarded` (the company
        already has owner users and the caller is not one of them: they
        approve from their own mükellef panel).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxpayerConsentApproveRequest"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerConsentOutcome"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`INVITATION_EMAIL_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`INVITATION_UNAVAILABLE` (decided, cancelled or expired)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer-consents/reject:
    post:
      tags: [TaxpayerOnboarding]
      operationId: rejectTaxpayerConsent
      summary: Decline an office's add-mükellef request
      description: Same account rule as approve.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "204": { description: Declined }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`INVITATION_EMAIL_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`INVITATION_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/onboarding-requests:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
    get:
      tags: [TaxpayerOnboarding]
      operationId: getTaxpayerOnboardingRequests
      summary: Offices asking to add this company
      description: Owners of the company (mükellef role `owner`) only; pending, unexpired requests for the company's own VKN/TCKN.
      security:
