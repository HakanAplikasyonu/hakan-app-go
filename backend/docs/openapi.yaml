              properties:
                machine_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,128}$", description: "Stable install id generated by the agent" }
                name: { type: string, maxLength: 120 }
                platform: { type: string, enum: [windows, macos, linux] }
                version: { type: string, maxLength: 64 }
      responses:
