name: CI

# Push covers every branch; a pull_request trigger only duplicated those runs
# and, for PRs opened by the auto-pr job (github-actions bot), produced empty
# "failure"/"action_required" runs that showed as red X's.
#
# schedule: a weekly image-build keeps the GHCR cache warm and catches base-image
# drift. workflow_dispatch lets you force a full build/publish by hand.
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (off the hour to dodge the rush)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Feature branches: newest push wins. main: never cancel mid-run, or a
  # publish could land without its tag (and release numbers could be skipped).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filter. Plain `git diff` (no third-party action) decides which jobs
  # run. Outputs gate every downstream job. Mapping:
  #   backend/**            -> backend, contracts
  #   backend/migrations/** -> + infra (image rebuild)
  #   frontend/**           -> frontend, contracts
  #   mobile/**             -> mobile, mobile_release (see the OpenAPI note in
  #                            the mobile job; openapi.yaml NEVER maps to mobile)
  #   packages/mobile-core/** -> mobile, mobile_office, mobile_release (#295:
  #                            both apps bundle the shared core)
  #   Dockerfiles / compose.prod.yml / deploy/** -> infra (image build)
  #   backend/cmd/** , backend/deploy/** , go.mod/go.sum , frontend
  #   package.json / pnpm-lock.yaml / next.config.* -> their app + infra
  #   docs/** , *.md , .github/* (other than this file) -> nothing
  #   this workflow file    -> full (run everything)
  # schedule / workflow_dispatch -> full.
  # `images` echoes deploy/images.json so image-build/publish-images can matrix
  # over every build-context service without hardcoding backend+frontend.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      contracts: ${{ steps.f.outputs.contracts }}
      infra: ${{ steps.f.outputs.infra }}
      mobile: ${{ steps.f.outputs.mobile }}
      mobile_office: ${{ steps.f.outputs.mobile_office }}
      desktop: ${{ steps.f.outputs.desktop }}
      extension: ${{ steps.f.outputs.extension }}
      full: ${{ steps.f.outputs.full }}
      mobile_release: ${{ steps.f.outputs.mobile_release }}
      images: ${{ steps.f.outputs.images }}
      e2e: ${{ steps.f.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          backend=false; frontend=false; contracts=false
          infra=false; mobile=false; desktop=false; full=false
          mobile_office=false

          if [ "$EVENT" != "push" ]; then
            # schedule / workflow_dispatch: no diff to compute, build everything.
            full=true
            files=""
          else
            # main: diff this push (BEFORE..SHA), which only decides mobile_release;
            # every main push runs the full suite below, so publish-images never
            # ships code whose tests were skipped. Feature branches: diff the
            # whole branch against its merge-base with main, so a docs-only push
            # after a red one still re-tests the branch before auto-pr merges it.
            base="$BEFORE"
            [ "$REF" = "refs/heads/main" ] || base=""
            if [ -z "$base" ] \
               || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # New branch or the before-commit is not in history: diff against
              # the merge-base with main; if that is unknown, treat as full.
              base=""
              if git fetch --no-tags --quiet origin main 2>/dev/null; then
                base="$(git merge-base FETCH_HEAD "$SHA" 2>/dev/null || true)"
              fi
            fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              full=true
              files=""
            else
              files="$(git diff --name-only "$base" "$SHA")"
            fi
          fi

          # The workflow file changing means "re-run everything".
          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/workflows/ci.yml) full=true ;;
              esac
            done <<< "$files"
          fi

          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Order matters: first match wins (case globs, * spans '/').
              case "$file" in
                # Kullanım kılavuzları (#274) ön yüzde de yayımlanır: eşitleme denetimi.
                docs/kullanim/*)                    frontend=true ;;
                docs/*|*.md|.github/*)              : ;;   # nothing (before app dirs: backend/*.md is docs)
                compose.prod.yml|deploy/*|scripts/prod-smoke.sh|scripts/prod-env.sh|scripts/backup-drill.sh)
                                                    infra=true ;;
                */Dockerfile|Dockerfile)            infra=true ;;
                # Image-shaping files outside the Dockerfile: the build loop
                # (backend/cmd), the entrypoint, and the dependency manifests.
                backend/cmd/*|backend/deploy/*|backend/go.mod|backend/go.sum)
                                                    backend=true; contracts=true; infra=true ;;
                frontend/package.json|frontend/pnpm-lock.yaml|frontend/next.config.*)
                                                    frontend=true; contracts=true; infra=true ;;
                backend/migrations/*)               backend=true; contracts=true; infra=true ;;
                backend/*)                          backend=true; contracts=true ;;
                frontend/*)                         frontend=true; contracts=true ;;
                mobile/*)                           mobile=true ;;
                mobile-office/*)                    mobile_office=true ;;
                packages/mobile-core/*)             mobile=true; mobile_office=true ;;
                *)                                  : ;;   # unmapped -> nothing
              esac
            done <<< "$files"
          fi

          # HAKAN (#50): masaüstü. Go sidecar backend modülünü import ettiği
          # için backend/pkg ve go.mod değişikliği de masaüstü işini çalıştırır.
          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                desktop/*|backend/pkg/*|backend/go.mod|backend/go.sum) desktop=true ;;
              esac
            done <<< "$files"
          fi

          # HAKAN (#388): WhatsApp Web uzantısı (extensions/whatsapp).
          extension=false
          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                extensions/whatsapp/*) extension=true ;;
              esac
            done <<< "$files"
          fi

          if [ "$full" = "true" ] || [ "$REF" = "refs/heads/main" ]; then
            backend=true; frontend=true; contracts=true; infra=true; mobile=true; desktop=true
            mobile_office=true; extension=true
          fi

          # HAKAN (#170): uçtan uca duman testi. Backend ya da frontend
          # değişince (main ve full dahil) ve testin kendi dosyaları değişince.
          e2e=false
          if [ "$backend" = "true" ] || [ "$frontend" = "true" ]; then e2e=true; fi
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                e2e/*|scripts/e2e-*|compose.local.yml|.env.example) e2e=true ;;
              esac
            done <<< "$files"
          fi

          # mobile_release: ONLY a real (non-doc) mobile/** diff. Never set by
          # `full`, and never by backend/docs/openapi.yaml — see the mobile job.
          mobile_release=false
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                mobile/*|packages/mobile-core/*) mobile_release=true ;;
              esac
            done <<< "$files"
          fi

          images="$(jq -c '.images' deploy/images.json)"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "contracts=$contracts"
            echo "infra=$infra"
            echo "mobile=$mobile"
            echo "mobile_office=$mobile_office"
            echo "desktop=$desktop"
            echo "extension=$extension"
            echo "full=$full"
            echo "mobile_release=$mobile_release"
            echo "images=$images"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

          echo "backend=$backend frontend=$frontend contracts=$contracts infra=$infra mobile=$mobile desktop=$desktop extension=$extension full=$full mobile_release=$mobile_release"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # HAKAN (#3): veritabanı testleri (internal/testdb) gerçek Postgres
    # üzerinde koşar. Her test kendi veritabanını açıp migration'ları uygular.
    # TESTDB_REQUIRED=1: bağlantı adresi yoksa testler atlanmaz, düşer.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TESTDB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # #299: dal koruması "up to date" istemediği için iki PR aynı migration
      # numarasıyla ayrı ayrı yeşil geçebiliyordu (000077, 000080). Çift
      # numara, eksik up/down ve main'in en yüksek numarasının altında kalan
      # yeni migration hata; boşluk uyarı. main'e giden push'ta da koşar
      # (backend main'de her zaman çalışır), girmiş bir çakışma kırmızı görünür.
      - name: Migration numaraları
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          scripts/check-migrations.sh --against origin/main
          scripts/check-migrations.test.sh
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      # Tenant izolasyon lint'i: tenant_tables.txt'deki her tablo sorgusu
      # organization_id ile kapsanmalı (internal/database/queries_test.go).
      - name: tenant_tables lint
        run: go test ./internal/database/ -run "TestTenantQueriesReferenceOrganization|TestLintCatchesMissingScopes" -count=1 -v
      - name: Test
        run: go test ./...
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

  # #312: aynı testler, tabloların sahibi süper kullanıcı OLMAYAN bir rolle
  # (scripts/db-roles.sql: hakan_owner). Süper kullanıcı FORCE ROW LEVEL
  # SECURITY'yi atlar; bu iş FORCE'un sahibe de uygulandığı kurulumu
  # (yönetilen Postgres) denetler: migration'lar, SECURITY DEFINER
  # fonksiyonları, rls.System ve TestNonSuperuserOwnerIsForced. Migration
  # up / down / up da bu rolle koşar.
  backend-owner:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hakan_owner:owner-ci-only@localhost:5432/postgres?sslmode=disable
      TESTDB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Roller (scripts/db-roles.sql)
        working-directory: .
        run: |
          for i in 1 2; do # idempotent: ikinci çalıştırma da geçmeli
            psql "postgres://postgres:postgres@localhost:5432/postgres" -X -q -v ON_ERROR_STOP=1 \
              -v owner_password=owner-ci-only -v backup_password=backup-ci-only -f scripts/db-roles.sql
          done
          psql "postgres://postgres:postgres@localhost:5432/postgres" -XtAc \
            "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname LIKE 'hakan_%' ORDER BY 1"
      - name: Test (süper kullanıcı olmayan sahip)
        run: go test ./...
      - name: Migration up / down / up (süper kullanıcı olmayan sahip)
        run: |
          v=$(sed -n 's#^FROM migrate/migrate:\(v[0-9.]*\).*#\1#p' Dockerfile | head -1)
          psql "postgres://hakan_owner:owner-ci-only@localhost:5432/postgres" -X -q -c "CREATE DATABASE owner_migrate"
          db="postgres://hakan_owner:owner-ci-only@localhost:5432/owner_migrate?sslmode=disable"
          m() { go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${v:-v4.20.1}" -path migrations -database "$db" "$@"; }
          m up
          m down -all
          m up

  # Security scans (#192, docs/guvenlik-taramalari.md). Every push: gitleaks
  # over the pushed history. Go changes: govulncheck (reachable vulnerabilities)
  # and gosec (HIGH severity, backend/.golangci.gosec.yml). Dependency
  # manifests: pnpm/npm audit at high+. A finding fails the job; justified
  # false positives are silenced in place (see the doc), never by skipping.
  security:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gitleaks (secrets in git history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: govulncheck (backend)
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: govulncheck (desktop sidecar)
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.full == 'true'
        working-directory: desktop/sidecar
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gosec (HIGH)
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          args: --config .golangci.gosec.yml
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm audit (frontend, high+)
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: npm audit (mobile, mobile-office, desktop, e2e, extensions/whatsapp; high+)
        run: |
          set -euo pipefail
          for d in mobile mobile-office desktop e2e extensions/whatsapp; do
            echo "::group::npm audit $d"
            (cd "$d" && npm audit --audit-level=high)
            echo "::endgroup::"
          done

  # Runs on a frontend change OR a contract change (backend/** sets contracts),
  # so a backend API edit re-verifies the committed frontend client.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Birim testleri (#381)
        run: pnpm test
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs
      - name: Kullanım kılavuzları eşit mi (#274)
        working-directory: .
        run: node scripts/sync-kullanim.mjs --check
      - name: Build
        run: pnpm build

  # HAKAN (#170): uçtan uca duman testi (Playwright). scripts/e2e-up.sh
  # compose altyapısını kurar, migration'ları sıfırdan uygular, demo seed'i
  # yükler, API'yi ve Next.js üretim derlemesini başlatır; e2e/ testleri
  # ofis paneli → mükellef paneli → Luca/Zirve indirme akışını koşar.
  # Zorunluluk (#194): ortam kurulumu ve erişilebilirlik taraması (axe-core,
  # kritik / ciddi ihlal, `@a11y` testleri) `ci` kapısını kırar. Akış
  # testleri henüz zorunlu değil: adım düzeyinde continue-on-error, düşerse
  # uyarı yazılır ve rapor artefaktta kalır.
  #
  # Paylar (#780): tek iş 30 dakikayı aşıyordu (300+ akış testi). Dört
  # paralel bacak, her biri kendi ortamını (compose, sıfırdan migration, demo
  # seed, API, frontend) kurar; bacaklar arasında paylaşılan veri yoktur.
  #   temel   : erişilebilirlik (zorunlu) + görsel regresyon + kılavuz
  #             görüntüleri; temiz demo verisinde.
  #   akis-N  : akış testlerinin N/3 payı (Playwright --shard). Pay dosya
  #             düzeyindedir (playwright.config.ts: fullyParallel false):
  #             bir dosyanın serial adımları hep aynı bacakta, sırayla koşar.
  # `ci` kapısı `needs: e2e` ile bütün bacakları bekler; biri düşerse e2e
  # sonucu failure olur. fail-fast kapalı: bir bacak ötekileri iptal etmez.
  #
  # Görsel temel görüntüleri CI'da yenilemek: dala (main dışı) mesajında
  # `[gorsel-guncelle]` geçen bir commit itin. temel bacağı görsel testi
  # --update-snapshots=changed ile koşar, değişen PNG'leri artefakt olarak
  # yükler; gorsel-guncelle işi onları aynı dala commit'ler. GITHUB_TOKEN ile
  # itilen commit yeni CI koşusu başlatmaz: doğrulamak için dala bir commit
  # daha itin.
  e2e:
    name: e2e (${{ matrix.bacak }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - bacak: temel
            pay: ""
          - bacak: akis-1
            pay: "1/3"
          - bacak: akis-2
            pay: "2/3"
          - bacak: akis-3
            pay: "3/3"
    env:
      GORSEL_GUNCELLE: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[gorsel-guncelle]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install e2e and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck e2e
        if: matrix.bacak == 'temel'
        working-directory: e2e
        run: npm run typecheck
      - name: Start environment
        run: scripts/e2e-up.sh
      - name: Erişilebilirlik (axe-core, zorunlu)
        if: matrix.bacak == 'temel'
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test --grep @a11y
      # #332: ana ekranlar dört temada ve üç kırılımda temel görüntüyle
      # karşılaştırılır (e2e/tests/gorsel.spec.ts-snapshots). Temiz demo
      # verisinde koşar. Farklar e2e-report-temel artefaktında.
      # Temel görüntüler CI'da doğrulanana kadar zorunlu değil.
      - name: Görsel regresyon (zorunlu değil)
        id: visual
        if: matrix.bacak == 'temel' && env.GORSEL_GUNCELLE != 'true'
        continue-on-error: true
        working-directory: e2e
        env:
          CI: "true"
        # Ayrı çıktı klasörü: sonraki adımlar test-results/'u temizler.
        run: npx playwright test --grep @visual --output=test-results-visual
      - name: Görsel regresyon sonucu
        if: steps.visual.outcome == 'failure'
        run: echo "::warning title=e2e::Görsel regresyon farkı var. Beklenen / gerçek / fark görüntüleri e2e-report-temel artefaktında. Bilerek değiştiyse mesajında [gorsel-guncelle] geçen bir commit itin."
      - name: Görsel temel görüntüleri yenile ([gorsel-guncelle])
        id: visual_update
        if: matrix.bacak == 'temel' && env.GORSEL_GUNCELLE == 'true'
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test --grep @visual --update-snapshots=changed --output=test-results-visual
      - uses: actions/upload-artifact@v5
        if: steps.visual_update.outcome == 'success'
        with:
          name: gorsel-temel-goruntuler
          path: e2e/tests/gorsel.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
      - name: Akış testleri (zorunlu değil)
        id: flows
        if: matrix.bacak != 'temel'
        continue-on-error: true
        working-directory: e2e
        env:
          CI: "true"
          # Ayrı rapor ve çıktı klasörü: akışların hata bağlamı (sayfa
          # görüntüsü, iz) artefaktta kalsın.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-flows
        run: npx playwright test --grep-invert "@a11y|@docs|@visual" --shard=${{ matrix.pay }} --output=test-results-flows
      - name: Akış testleri sonucu
        if: steps.flows.outcome == 'failure'
        run: echo "::warning title=e2e::Akış testleri düştü (zorunlu değil, pay ${{ matrix.pay }}). Ayrıntı e2e-report-${{ matrix.bacak }} artefaktında."
      # #274: kılavuz görüntüleri demo verisinden yeniden üretilir ve artefakt
      # olarak yüklenir; depodakilerle karşılaştırılmaz (yazı tipi, saat vb.
      # piksel farkı yaratır). Güncellemek: artefaktı indirip işleyin ya da
      # yerelde `npx playwright test --grep @docs`.
      - name: Kılavuz ekran görüntüleri (zorunlu değil)
        id: docs
        if: matrix.bacak == 'temel'
        continue-on-error: true
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test --grep @docs
      - uses: actions/upload-artifact@v5
        if: steps.docs.outcome == 'success'
        with:
          name: kilavuz-goruntuleri
          path: frontend/public/yardim/img/
          retention-days: 14
      - name: Logs on failure
        if: failure() || steps.flows.outcome == 'failure'
        run: |
          for f in e2e/.run/server.log e2e/.run/frontend.log; do
            echo "::group::$f"; tail -200 "$f" || true; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-report-${{ matrix.bacak }}
          path: |
            e2e/playwright-report/
            e2e/playwright-report-flows/
            e2e/test-results/
            e2e/test-results-flows/
            e2e/test-results-visual/
            e2e/.run/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop environment
        if: always()
        run: scripts/e2e-down.sh

  # [gorsel-guncelle] (#780): e2e temel bacağının CI'da (linux, aynı
  # Chromium ve yazı tipleri) yenilediği görsel temel görüntüleri aynı dala
  # commit'ler. Yalnızca main dışındaki dallarda ve commit mesajında işaret
  # varken koşar. Yazma izni yalnızca bu işte.
  gorsel-guncelle:
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[gorsel-guncelle]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v5
        with:
          name: gorsel-temel-goruntuler
          path: e2e/tests/gorsel.spec.ts-snapshots/
      - name: Commit ve push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add e2e/tests/gorsel.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "Temel görüntülerde değişiklik yok." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-only | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(e2e): görsel temel görüntüler CI'da yenilendi" -m "Kaynak: run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA::7}."
          git push origin "HEAD:refs/heads/${BRANCH}"

  # Env config (docs/design/env-core.md): .env.server.example matches
  # deploy/env/schema, .env.example has every schema key, prod-env tests pass
  # (they also run `docker compose config` on compose.prod.yml).
  env:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Env schema sync
        run: scripts/check-env-sync.sh
      - name: Backend env reaches compose.prod.yml
        run: |
          scripts/check-compose-env.sh
          scripts/check-compose-env.test.sh

  # Build every build-context image (deploy/images.json), NO push. Proves the
  # Dockerfiles still build on an infra change / weekly / manual run. Skipped on
  # main pushes, where publish-images builds and pushes the same images.
  # Non-release builds are versioned sha-<short> (no release notes).
  image-build:
    needs: changes
    if: >-
      ( github.event_name != 'push' || github.ref != 'refs/heads/main' ) &&
      ( needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true' )
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        run: |
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.image.service }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: false
          # Always re-resolve FROM tags (pinned Go toolchain, security fixes).
          pull: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # Production stack on an empty runner (#177, docs/deploy.md): build both
  # images locally (no push), then scripts/prod-smoke.sh brings up
  # deploy/compose.prod.yml (Postgres, Redis, SeaweedFS, Meilisearch,
  # Centrifugo, migrate, backend, worker, frontend, Caddy) with throwaway
  # secrets and checks migrations, /readyz and proxy -> frontend -> API.
  # Same trigger as image-build; no registry login, no repository secrets.
  prod-smoke:
    needs: changes
    if: >-
      ( github.event_name != 'push' || github.ref != 'refs/heads/main' ) &&
      ( needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true' )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          push: false
          tags: local/hakan-backend:main
          build-args: |
            VERSION=smoke-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: Build frontend image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          push: false
          tags: local/hakan-frontend:main
          cache-from: type=gha,scope=frontend
      - name: Build backup image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          file: deploy/backup/Dockerfile
          load: true
          push: false
          tags: local/hakan-backup:main
          cache-from: type=gha,scope=backup
      - name: Smoke test deploy/compose.prod.yml
        run: scripts/prod-smoke.sh

  # Backup / restore drill (#178, docs/yedekleme.md): build the backup image,
  # migrate a fresh Postgres, back up (encrypted dump + roles + bucket), check
  # no plaintext leaks, restore into a second empty cluster and a new bucket,
  # then compare schema version, every table's row count and the objects.
  backup-drill:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backup image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          file: deploy/backup/Dockerfile
          load: true
          push: false
          tags: local/hakan-backup:main
          cache-from: type=gha,scope=backup
      - name: Restore drill
        run: scripts/backup-drill.sh

  # Main push: decide the release ONCE, before any image is built, so every
  # image bakes the same provenance and release-tag cuts exactly this version.
  #   version  next v0.N (after the highest existing v0.* tag)
  #   notes    auto-generated: `git log --no-merges` since the previous v0.* tag
  #            (no hand-kept CHANGELOG), capped at 200 lines
  #   release  base64 release.json {version, git_sha, built_at, notes} -> the
  #            backend embeds it (internal/buildinfo); cmd/release-record writes
  #            it to app_releases when the migrate service runs on deploy.
  release-meta:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.m.outputs.version }}
      built_at: ${{ steps.m.outputs.built_at }}
      release_b64: ${{ steps.m.outputs.release_b64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: m
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          last="$(git tag -l 'v0.*' | sed -n 's/^v0\.\([0-9]\+\)$/\1/p' | sort -n | tail -1)"
          version="v0.$(( ${last:-0} + 1 ))"
          if [ -n "$last" ]; then
            range="v0.${last}..${GITHUB_SHA}"; since="since v0.${last}"
          else
            range="${GITHUB_SHA}"; since="(first release)"
          fi
          log="$(git log --no-merges --pretty='- %s (%h)' "$range")"
          total="$(printf '%s' "$log" | grep -c '^- ' || true)"
          notes="$(printf '%s\n' "$log" | head -n 200)"
          if [ "${total:-0}" -gt 200 ]; then
            notes="${notes}"$'\n'"- …and $(( total - 200 )) more commits ${since}."
          fi
          [ -n "$log" ] || notes="- No code changes ${since} (redeploy)."
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_b64="$(jq -nc --arg v "$version" --arg s "$GITHUB_SHA" --arg b "$built_at" --arg n "$notes" \
            '{version:$v, git_sha:$s, built_at:$b, notes:$n}' | base64 -w0)"
          {
            echo "version=$version"
            echo "built_at=$built_at"
            echo "release_b64=$release_b64"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $version ($since)"
            echo
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  # Green push to main: build + push every image to GHCR as :main,
  # :sha-<short> and :v0.N. Image path is repo-derived
  # (ghcr.io/<owner>/<repo>-<service>), never a hardcoded app name, so forks
  # publish under their own name. Provenance (release-meta) goes in as build
  # args + OCI labels on every image; only the backend Dockerfile consumes the
  # args (an image that doesn't declare them just ignores them).
  # always() so a docs-only main push (backend/frontend skipped) still refreshes
  # the tags; a real backend/frontend/env failure blocks the push via the gate.
  publish-images:
    needs: [changes, backend, frontend, env, release-meta]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-meta.result == 'success' &&
      needs.env.result == 'success' &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure' &&
      needs.backend.result != 'cancelled' &&
      needs.frontend.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"            # ghcr.io requires lowercase
          echo "image=ghcr.io/${repo}-${{ matrix.image.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.image.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: true
          # Always re-resolve FROM tags (pinned Go toolchain, security fixes).
          pull: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:${{ needs.release-meta.outputs.version }}
          build-args: |
            VERSION=${{ needs.release-meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.release-meta.outputs.built_at }}
            RELEASE_JSON_B64=${{ needs.release-meta.outputs.release_b64 }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-meta.outputs.version }}
            org.opencontainers.image.created=${{ needs.release-meta.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # Images are on GHCR -> cut the version release-meta chose (the one baked
  # into the images). Dokploy watches v0.* and deploys the tag; its migrate
  # service then records the release in app_releases.
  release-tag:
    needs: [release-meta, publish-images]
    if: always() && needs.publish-images.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag ${{ needs.release-meta.outputs.version }}
        env:
          TAG: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if existing="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at ${GITHUB_SHA::7} (re-run); nothing to do."
              exit 0
            fi
            echo "::error title=Tag taken::$TAG already exists at ${existing::7}, but the images were baked as $TAG for ${GITHUB_SHA::7}. Re-run the whole workflow so release-meta picks the next number."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged **$TAG** at \`${GITHUB_SHA::7}\`. Dokploy deploys on v0.* tags." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Mobile (Expo). Skips cleanly (green) until mobile/package.json exists.
  #
  # OpenAPI -> mobile DECOUPLING (the fix for spurious app releases):
  # The mobile client types are COMMITTED (mobile/src/core/api/schema.d.ts,
  # generated by a version-PINNED openapi-typescript from
  # backend/docs/openapi.yaml). The release trigger is mobile/** ONLY
  # (changes.outputs.mobile_release), never backend/docs/openapi.yaml.
  # openapi-typescript output is deterministic, so a backend change that does
  # not alter the API surface regenerates an identical schema.d.ts -> no
  # mobile/** diff -> no release. A real API change shows up as a committed
  # schema.d.ts diff, which IS a mobile/** change and does release.
  #
  # This job (verification, never a release) also runs on backend changes.
  # Whether the committed types match openapi.yaml is the api-types job's
  # check (#276), so an API edit that forgot to regenerate them fails there.
  # ---------------------------------------------------------------------------
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - id: guard
        run: |
          if [ -f mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Mobile CI skipped: \`mobile/package.json\` does not exist yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('mobile/.nvmrc') != '' && 'mobile/.nvmrc' || 'frontend/.nvmrc' }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm ci
      - name: Generator is pinned
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: |
          # Stable output needs an exact openapi-typescript version (no ^ / ~).
          node -e '
            const p = require("./package.json");
            const v = (p.devDependencies || {})["openapi-typescript"] || (p.dependencies || {})["openapi-typescript"];
            if (!v) { console.error("::error::openapi-typescript is not a mobile dependency"); process.exit(1); }
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error(`::error::pin openapi-typescript to an exact version (found "${v}")`); process.exit(1); }
            console.log(`openapi-typescript pinned at ${v}`);
          '
      - name: Lint
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm run lint
      - name: Typecheck
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm run typecheck
      - name: Test
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm test --if-present
      # #295: ortak çekirdek (packages/mobile-core) saf modüllerin birim testleri.
      # Tip denetimi ve lint iki uygulamanın kendi adımlarında (paket kaynağı
      # uygulamaların içe aktarmalarıyla derlenir).
      - name: Test (packages/mobile-core)
        if: steps.guard.outputs.present == 'true'
        working-directory: packages/mobile-core
        run: npm test
      # #203: config plugins (expo-updates, Sentry, notifications, app links)
      # must still produce a native project; the emulator Maestro run is
      # documented in mobile/README.md ("Duman testleri") and not run here.
      - name: Native config (expo prebuild, Android)
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        env:
          EXPO_PUBLIC_APP_ENV: preview
        run: npx expo prebuild --platform android --no-install --clean
      # Committed API types are checked by the api-types job (#276), against
      # the branch merged with main.

  # HAKAN (#236): müşavir mobil uygulaması (ayrı Expo projesi, app.hakan.office).
  # mobile/ işiyle aynı denetimler; backend değişince de çalışır ki API tipleri
  # (src/core/api/schema.d.ts) güncel kalsın. Mağaza sürümü (EAS) bu işte yok; #242
  # yapılandırmayı test eder, gönderim karar sonrası elle yapılır.
  mobile-office:
    needs: changes
    if: needs.changes.outputs.mobile_office == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile-office
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile-office/.nvmrc
          cache: npm
          cache-dependency-path: mobile-office/package-lock.json
      - name: Install
        run: npm ci
      # İşlenmiş API tipleri api-types işinde denetlenir (#276).
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test (packages/mobile-core)
        working-directory: packages/mobile-core
        run: npm test
      # #242: eklentiler (expo-updates, Sentry, bildirim, bağlantılar) yerel
      # projeyi üretebilmeli. Emülatörde Maestro çalıştırması CI'da yok
      # (mobile-office/README.md, "Duman testleri").
      - name: Native config (expo prebuild, Android)
        env:
          EXPO_PUBLIC_APP_ENV: preview
        run: npx expo prebuild --platform android --no-install --clean

  # HAKAN (#50): masaüstü (Tauri v2 kabuk + Go sidecar). Linux'ta derlenir
  # ve test edilir; imzalı macOS/Windows paketleri desktop-release.yml'de.
  # HAKAN (#388): WhatsApp Web uzantısı (Manifest V3, TypeScript). Seçiciler
  # fixture HTML'leriyle (tests/fixtures) test edilir; build dist/'i üretir.
  extension-whatsapp:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/whatsapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: extensions/whatsapp/.nvmrc
          cache: npm
          cache-dependency-path: extensions/whatsapp/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (vitest + jsdom, WhatsApp Web fixture'ları)
        run: npm test
      - name: Paket (zip, mağazaya gönderilmez)
        run: npm run package
      - uses: actions/upload-artifact@v5
        with:
          name: hakan-whatsapp-uzantisi
          path: extensions/whatsapp/hakan-whatsapp-*.zip
          if-no-files-found: error
          retention-days: 30

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/sidecar/go.mod
          cache-dependency-path: |
            desktop/sidecar/go.sum
            backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Sidecar vet + test
        working-directory: desktop/sidecar
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test ./...
      - name: Sidecar golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: desktop/sidecar
      - name: Install
        run: npm ci
      # HAKAN (#183): sürüm betikleri (güncelleyici manifesti, kanal seçimi).
      - name: Release scripts test
        run: npm test
      # HAKAN (#206): ui/ dosyaları Chromium'da sahte Tauri IPC'siyle.
      - name: UI test (Playwright, mock IPC)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      # #332: ajan penceresinin ana ekranları dört temada ve üç pencere
      # genişliğinde temel görüntüyle karşılaştırılır
      # (desktop/tests/ui/gorsel/temel). Temel görüntüler CI'da doğrulanana
      # kadar zorunlu değil; farklar desktop-gorsel artefaktında.
      - name: UI görsel regresyon (zorunlu değil)
        id: desktop_visual
        continue-on-error: true
        run: npm run test:visual
      - name: UI görsel regresyon sonucu
        if: steps.desktop_visual.outcome == 'failure'
        run: echo "::warning title=desktop::Masaüstü görsel farkı var. Gerçek ve fark görüntüleri desktop-gorsel artefaktında."
      - uses: actions/upload-artifact@v5
        if: steps.desktop_visual.outcome == 'failure'
        with:
          name: desktop-gorsel
          path: desktop/tests/ui/gorsel/sonuc/
          retention-days: 7
      - name: Build sidecar
        run: npm run sidecar
      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: rustfmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (shell ↔ Go sidecar)
        working-directory: desktop/src-tauri
        env:
          HAKAN_SIDECAR_REQUIRED: "1"
        run: cargo test
      - name: Self-test (app opens, talks to sidecar)
        working-directory: desktop/src-tauri
        run: |
          cargo build
          out=$(xvfb-run -a target/debug/hakan-desktop --self-test | grep -E '^\{.*"ok":' | tail -1)
          echo "$out"
          echo "$out" | jq -e '.ok == true' >/dev/null

  # EAS release on a green main push, ONLY when mobile/** really changed
  # (changes.outputs.mobile_release). Skips green with a summary note when
  # mobile/ is absent, EXPO_TOKEN is unset, or app.json has no EAS projectId.
  mobile-release:
    needs: [changes, backend, frontend, mobile]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled' &&
      needs.frontend.result != 'failure' &&
      needs.frontend.result != 'cancelled' &&
      needs.mobile.result != 'failure' &&
      needs.mobile.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_RELEASE: ${{ needs.changes.outputs.mobile_release }}
        run: |
          skip() { echo "ship=false" >> "$GITHUB_OUTPUT"; echo "Mobile release skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ -f mobile/package.json ] || skip "\`mobile/\` does not exist yet."
          [ "$MOBILE_RELEASE" = "true" ] || skip "no \`mobile/**\` change in this push (backend / OpenAPI edits never ship the app)."
          [ -n "$EXPO_TOKEN" ] || skip "\`EXPO_TOKEN\` secret is not set."
          pid="$(jq -r '.expo.extra.eas.projectId // empty' mobile/app.json 2>/dev/null || true)"
          [ -n "$pid" ] || skip "\`mobile/app.json\` has no \`expo.extra.eas.projectId\` (run \`eas init\`)."
          echo "ship=true" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ship == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('mobile/.nvmrc') != '' && 'mobile/.nvmrc' || 'frontend/.nvmrc' }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.guard.outputs.ship == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        if: steps.guard.outputs.ship == 'true'
        working-directory: mobile
        run: npm ci
      - name: EAS build (production, all platforms)
        if: steps.guard.outputs.ship == 'true'
        working-directory: mobile
        run: |
          eas build --platform all --profile production --non-interactive --no-wait
          echo "EAS production build queued for \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

  # HAKAN (D20): boilerplate'teki auto-pr işi kaldırıldı. Her issue kendi
  # dalında tek PR olarak açılır ve `gh pr merge --auto --squash` ile CI yeşil
  # olunca birleşir. Push çalıştırması PR'ın son commit'inde kontrol olarak görünür.

  # Single required status check. Passes when every gated job is success or
  # skipped; fails if any failed or was cancelled. Make THIS the required check
  # in branch protection (not the individual jobs, which skip by design).
  # ---------------------------------------------------------------------------
  # HAKAN (#276): API tipleri. frontend/src/generated/api.d.ts,
  # mobile/src/core/api/schema.d.ts ve mobile-office/src/core/api/schema.d.ts
  # backend/docs/openapi.yaml'dan üretilip işlenir. Bu iş üçünü yeniden üretir
  # ve işlenmiş dosyalardan farklıysa düşer (zorunlu, kapıda).
  #
  # Dal main ile birleştirilerek denetlenir: openapi.yaml'a dokunan iki PR ayrı
  # ayrı yeşil olup birlikte main'i kırabiliyordu (biri birleşince ötekinin
  # tipleri eskir). Birleştirme çakışırsa dal kendi hâliyle denetlenir; çakışma
  # zaten birleştirmeyi durdurur. Düzeltme: main'i al, make api-types, işle.
  # ---------------------------------------------------------------------------
  api-types:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.mobile == 'true' || needs.changes.outputs.mobile_office == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: main ile birleştir (yalnızca dallarda)
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags --quiet origin main
          if git merge --no-edit --no-ff FETCH_HEAD >/dev/null 2>&1; then
            echo "Denetim dal + main birleşimi üzerinde (\`$(git rev-parse --short FETCH_HEAD)\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort || true
            echo "::warning title=api-types::main ile birleştirme çakıştı; dal kendi hâliyle denetleniyor."
          fi
      - name: API tipleri güncel mi
        run: |
          if ! scripts/api-types.sh --check; then
            echo "::error title=Eskimiş API tipleri::backend/docs/openapi.yaml ile işlenmiş tipler uyuşmuyor. main'i dala alın, 'make api-types' çalıştırın ve frontend/src/generated/api.d.ts, mobile/src/core/api/schema.d.ts, mobile-office/src/core/api/schema.d.ts dosyalarını işleyin."
            exit 1
          fi

  ci:
    if: always()
    needs: [changes, backend, backend-owner, frontend, env, security, api-types, mobile, mobile-office, desktop, extension-whatsapp, image-build, prod-smoke, backup-drill, e2e, gorsel-guncelle, release-meta, publish-images, release-tag, mobile-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI gate failed::A required job reported '$r'."; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
