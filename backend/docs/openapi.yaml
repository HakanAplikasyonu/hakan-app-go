        Requires `tenant.invoices.write` and an `active` connection. Reads
        documents issued `from`–`to` (YYYY-MM-DD) and writes them with the
        common duplicate rules: sales invoices and detailed / e-invoiced
        bills as invoices, kalemsiz e-belgesiz bills as expenses (10 §4.3).
        Estimates, recurring templates and cancelled documents are counted in
        `excluded`. Once per 5 minutes per connection.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeParasutReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`INVALID_RANGE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`SYNC_THROTTLED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`PARASUT_AUTH_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/bank-services:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Bank]
      operationId: listTenantBankServices
      summary: Banks that can be connected through their web service
      description: |
        Requires `tenant.bank.read`. Banks with a written adapter (#49:
        Vakıfbank) and the credential fields their form needs. Other banks
        stay on statement upload.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankServiceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Bank]
      operationId: listTenantBankConnections
      summary: The taxpayer's bank web-service connections
      description: Requires `tenant.bank.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankConnectionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Bank]
      operationId: createTenantBankConnection
      summary: Start connecting a bank account (draft)
      description: |
        Requires `tenant.bank.write`. Opens a `draft` connection
        (`source_connections`, `source_system = bank_<id>`) with the IBANs to
        print on the branch instruction. `environment` is `production`
        (default) or `test` (the bank's test system).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_id]
              properties:
                bank_id: { type: string, example: vakifbank }
                environment: { type: string, enum: [production, test] }
                ibans: { type: array, items: { type: string } }
      responses:
        "201":
          description: Draft connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`BANK_NOT_SUPPORTED` or `INVALID_IBAN`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections/{connectionUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/BankConnectionUuid"
    get:
      tags: [Bank]
      operationId: getTenantBankConnection
      summary: One bank connection
      description: Requires `tenant.bank.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections/{connectionUuid}/instruction:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/BankConnectionUuid"
    get:
      tags: [Bank]
      operationId: getTenantBankConnectionInstruction
      summary: Pre-filled branch instruction (PDF)
      description: |
        Requires `tenant.bank.write`. The instruction letter of 20 §5.2 with
        the taxpayer's title, VKN, tax office, the IBANs, the fixed egress
        IPs (`BANK_EGRESS_IPS`) and the technical contact. The taxpayer
        signs it and hands it to the branch. A `draft` becomes `form_ready`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: "`BANK_EGRESS_NOT_CONFIGURED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections/{connectionUuid}/submitted:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/BankConnectionUuid"
    post:
      tags: [Bank]
      operationId: markTenantBankConnectionSubmitted
      summary: The instruction was handed to the branch
      description: Requires `tenant.bank.write`. `draft` / `form_ready` → `submitted_to_bank`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections/{connectionUuid}/credentials:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/BankConnectionUuid"
    put:
      tags: [Bank]
      operationId: setTenantBankConnectionCredentials
      summary: Enter the bank's service user and verify it
      description: |
        Requires `tenant.bank.write`. `values` holds the bank's
        `credential_fields`. They are written to the credential vault (never
        to the connection row or logs), then a one-day query verifies them.
        Success: accounts are linked to cash boxes by IBAN (missing ones are
        created) and the connection is `active`. A bank refusal is not an
        HTTP error: the connection is `failed` and `error` carries the reason
        (`ip_rejected`, `bad_credentials`, `instruction_missing`,
        `tax_id_mismatch` …), the bank's code and the Turkish text.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: Connection after verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`CREDENTIALS_INCOMPLETE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`VAULT_NOT_CONFIGURED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-connections/{connectionUuid}/sync:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/BankConnectionUuid"
    post:
      tags: [Bank]
      operationId: syncTenantBankConnection
      summary: Read movements now ("şimdi çek")
      description: |
        Requires `tenant.bank.write` and an `active` connection. Reads
        `from`–`to` (YYYY-MM-DD, Türkiye days) in the bank's window size and
        writes the movements with the duplicate rules and classification. At
        most once per 5 minutes per connection; not older than the bank keeps
        (Vakıfbank 365 days).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBankSyncResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`INVALID_RANGE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`BANK_SYNC_THROTTLED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`BANK_REFUSED`: details carry `reason` and the bank's `code`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-statements:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [Bank]
      operationId: importTenantBankStatement
      summary: Import a bank statement file (MT940 / MT942, .xlsx, CSV, text PDF)
      description: |
        Requires `tenant.bank.write` and an active engagement. The account is
        found from the IBAN in the file (or the `:25:` account number); when
        the file names none, send `cash_box_uuid`. A file naming an account
        the taxpayer does not have imports nothing (`UNKNOWN_BANK_ACCOUNT`);
        add it first with `POST .../cash-boxes`.
        Movements go through the duplicate rules (same source key, running
        balance, lookalike) and are classified. A balance that does not add
        up raises `BNK_GAP`; a text PDF whose balance does not add up is
        refused. `?preview=true` reports the same counts without writing.
      security:
        - bearerAuth: []
      parameters:
        - { name: preview, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                cash_box_uuid: { type: string, format: uuid }
      responses:
        "200":
          description: Preview report (nothing written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBankStatementReport"
        "201":
          description: Import report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBankStatementReport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: File too large (`UPLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not a supported statement format (`UNSUPPORTED_FILE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `UNKNOWN_BANK_ACCOUNT`, `BANK_ACCOUNT_REQUIRED`, `STATEMENT_UNREADABLE`, `STATEMENT_INVALID_ROW`,
            `STATEMENT_BALANCE_MISMATCH` (text PDF) or `SCANNED_PDF`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/cash-boxes:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Bank]
      operationId: listTenantCashBoxes
      summary: The taxpayer's bank accounts and cash registers
      description: |
        Requires `tenant.bank.read`. Accounts created here and those a bank
        web service connection created (`web_service: true`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cash boxes
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CashBox" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Bank]
      operationId: createTenantCashBox
      summary: Add a bank account or cash register
      description: |
        Requires `tenant.bank.write` and an active engagement. Needed before a
        statement file naming this account can be imported
        (`UNKNOWN_BANK_ACCOUNT`, #144). `type` defaults to `bank_account`,
        which needs an `iban` or a `bank_account_number`. The IBAN is
        validated (mod 97) and the bank is read from it. An IBAN the taxpayer
        already has returns `409 CASH_BOX_EXISTS`. Without `name` a name is
        made from the currency and the IBAN's last four digits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCashBoxRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeCashBox" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`INVALID_CASH_BOX` (type, iban, currency or name; the field is in `details`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/cash-boxes/{cashBoxUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: cashBoxUuid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Bank]
      operationId: renameTenantCashBox
      summary: Rename a cash box
      description: Requires `tenant.bank.write`. Only the name changes; IBAN and currency are fixed once movements exist.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeCashBox" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`INVALID_CASH_BOX` (empty or too long name)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/bank-statements/{importId}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Bank]
      operationId: undoTenantBankStatementImport
      summary: Undo a statement import
      description: |
        Requires `tenant.bank.write`. Removes the source rows of that import;
        a movement left without any channel is deleted, one that also came
        from another channel keeps it and re-picks its primary source.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [import_id, deleted]
                    properties:
                      import_id: { type: string, format: uuid }
                      deleted: { type: integer, description: Movements deleted }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/account-plan/imports:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [AccountPlan]
      operationId: importEngagementAccountPlan
      summary: Import the target account plan (Luca hesap planı or mizan, .xlsx / .csv)
      description: |
        Requires `tenant.account_plan.write` and an active engagement. The file becomes the engagement's active plan for `target` (default `luca`); the previous version stays in the import history. The header row is detected ("Hesap Kodu", "Hesap Adı"; borç / alacak / bakiye columns mark a trial balance). Codes are normalized to the dotted form (`120 01 001` → `120.01.001`). Legacy `.xls` is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                target: { type: string, default: luca }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountPlanImportResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "413":
          description: File too large (`UPLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not .xlsx or .csv (`UNSUPPORTED_FILE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [AccountPlan]
      operationId: listEngagementAccountPlanImports
      summary: Account plan import history (newest first; the first per target is active)
      description: Requires `tenant.account_plan.read` and an active engagement.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountPlanImportList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/account-plan/accounts:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [AccountPlan]
      operationId: listEngagementAccountPlanAccounts
      summary: Accounts of the active plan
      description: Requires `tenant.account_plan.read`. `q` matches a code prefix or a name substring.
      security:
        - bearerAuth: []
      parameters:
        - { name: target, in: query, schema: { type: string, default: luca } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountPlanAccountPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/account-plan/check:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [AccountPlan]
      operationId: checkEngagementAccountCodes
      summary: Check account codes against the active plan
      description: |
        Requires `tenant.account_plan.read`. Read-only: reports `missing` (not in the plan), `non_leaf` (group accounts with sub-accounts) and `invalid` (not account codes). With no plan loaded `plan_loaded` is false and nothing is reported. The export gate (ACCOUNT_NOT_IN_TARGET_PLAN) uses the same check and raises the warning.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                target: { type: string, default: luca }
                codes:
                  type: array
                  maxItems: 5000
                  items: { type: string }
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountPlanCheck"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/account-plan/missing-template:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [AccountPlan]
      operationId: downloadMissingAccountsTemplate
      summary: Excel of accounts to open in Luca (unverified template)
      description: |
        Requires `tenant.account_plan.read`. Returns an .xlsx with "Hesap Kodu" and "Hesap Adı" columns. Luca's real template layout is not verified yet (D18); the file says so on its "Bilgi" sheet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string }
                      name: { type: string }
      responses:
        "200":
          description: Spreadsheet
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/periods/matrix:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [Periods]
      operationId: getTenantPeriodMatrix
      summary: Engagement × period matrix (command center)
      description: |
        Requires `tenant.periods.read`. Active engagements of the office (only
        assigned ones without `tenant.engagements.read_all`) × the last
        `periods` months ending at `until` (default: the current month,
        Türkiye time). Each cell: readiness (no open blocker and no open
        change request), lock state and counts.
      security:
        - bearerAuth: []
      parameters:
        - { name: until, in: query, required: false, schema: { $ref: "#/components/schemas/Period" } }
        - { name: periods, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 24, default: 6 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePeriodMatrix"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/periods/{period}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [Periods]
      operationId: getEngagementPeriodReadiness
      summary: Readiness of one period
      description: |
        Requires `tenant.periods.read`, `tenant.engagements.read` and engagement
        access. `ready` is true when the period has no open blocker warning
        (period-bound, or on an invoice of the period) and no open change
        request. The lock is reported but does not decide readiness.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePeriodReadiness"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/periods/{period}/lock:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/PeriodPath"
    post:
      tags: [Periods]
      operationId: lockEngagementPeriod
      summary: Lock a period
      description: |
        Requires `tenant.periods.lock` and engagement access. After locking,
        invoices arriving for the period do not change the stored record: a
        change request is opened and `LOCKED_PERIOD_CHANGE` raised
        (02-adaptor-mimarisi.md §3.4). The lock is written to the lock event
        log. 409 when the period is already locked.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockInput"
      responses:
        "200":
          description: Readiness after locking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePeriodReadiness"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/periods/{period}/unlock:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/PeriodPath"
    post:
      tags: [Periods]
      operationId: unlockEngagementPeriod
      summary: Unlock a period
      description: |
        Requires `tenant.periods.lock` and engagement access. `reason` is
        required and kept in the lock event log. Open change requests stay
        open. 409 when the period is not locked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodUnlockInput"
      responses:
        "200":
          description: Readiness after unlocking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePeriodReadiness"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/periods/{period}/lock-events:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [Periods]
      operationId: listEngagementPeriodLockEvents
      summary: Lock audit trail of a period
      description: Requires `tenant.periods.read` and engagement access. Newest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lock events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePeriodLockEventList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/change-requests:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [Periods]
      operationId: listEngagementChangeRequests
      summary: Change requests of locked periods
      description: |
        Requires `tenant.periods.read` and engagement access. Open requests
        unless `status` is given (`all`: any status). Newest first.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, applied, rejected, all], default: open } }
        - { name: period, in: query, required: false, schema: { $ref: "#/components/schemas/Period" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Change requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeChangeRequestPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/change-requests/{changeRequestUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/ChangeRequestUuid"
    get:
      tags: [Periods]
      operationId: getEngagementChangeRequest
      summary: One change request with its new content
      description: Requires `tenant.periods.read` and engagement access. `new_payload` is the held invoice in the common model.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeChangeRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/change-requests/{changeRequestUuid}/apply:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/ChangeRequestUuid"
    post:
      tags: [Periods]
      operationId: applyEngagementChangeRequest
      summary: Apply a change request
      description: |
        Requires `tenant.change_requests.decide` and engagement access. Writes
        the held content to the invoice through the normal upsert path (the
        period stays locked), records who decided and when, and auto-resolves
        `LOCKED_PERIOD_CHANGE` when no other request is open for the record,
        all in one transaction. 409 when the request is already decided or
        no longer applies (a source of equal or higher priority won meanwhile).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Applied change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeChangeRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/change-requests/{changeRequestUuid}/reject:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/ChangeRequestUuid"
    post:
      tags: [Periods]
      operationId: rejectEngagementChangeRequest
      summary: Reject a change request
      description: |
        Requires `tenant.change_requests.decide` and engagement access. The
        record is not changed; `LOCKED_PERIOD_CHANGE` auto-resolves when no
        other request is open for the record. 409 when already decided.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rejected change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeChangeRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [DocumentTasks]
      operationId: listTenantDocumentTasks
      summary: List missing-document tasks of an engagement (newest first)
      description: |
        Requires `tenant.doc_tasks.read` and engagement access. `status`
        defaults to `open`; `all` lists every status.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, submitted, matched, cancelled, all], default: open } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTaskList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks/detect:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [DocumentTasks]
      operationId: detectTenantMissingDocuments
      summary: Run the missing-document control for a period
      description: |
        Requires `tenant.doc_tasks.write`. Producer `control:missing_document`
        (21 §6.3): an outgoing `supplier_payment` without a document raises
        `BNK_UNDOCUMENTED_PAYMENT`, an incoming `customer_collection` without a
        document raises `BNK_UNINVOICED_COLLECTION` (entity
        `bank_transaction`). A movement that is matched in banking, ignored,
        cancelled or has a document uploaded by the mükellef is
        auto-resolved; open tasks of such movements are closed
        (`cancel_reason=resolved`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              additionalProperties: false
              properties:
                period: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10" }
      responses:
        "200":
          description: Detection report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMissingDocumentDetection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks/generate:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [DocumentTasks]
      operationId: generateTenantDocumentTasks
      summary: Open tasks for the mükellef from open BNK_* warnings
      description: |
        Requires `tenant.doc_tasks.write`. Opens one task per bank
        transaction with an open `BNK_UNDOCUMENTED_PAYMENT` /
        `BNK_UNINVOICED_COLLECTION` warning (optionally limited to `period`
        and `warning_uuids`). A transaction that already has an open task is
        skipped. With `period`, detection runs first unless `detect=false`.
        The mükellef's members get an in-app (mobile push) and email
        notification; reminders follow with backoff.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                period: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
                warning_uuids:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
                detect: { type: boolean, description: "Default: true when period is set" }
                due_days: { type: integer, minimum: 1, maximum: 90, default: 7 }
                note: { type: string, maxLength: 1000, description: Shown to the mükellef }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTaskGenerate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks/{taskUuid}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/DocumentTaskUuid"
    get:
      tags: [DocumentTasks]
      operationId: getTenantDocumentTask
      summary: Get a task with its uploads
      description: Requires `tenant.doc_tasks.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTask" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks/{taskUuid}/cancel:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/DocumentTaskUuid"
    post:
      tags: [DocumentTasks]
      operationId: cancelTenantDocumentTask
      summary: Cancel an open task
      description: Requires `tenant.doc_tasks.write`. A matched or cancelled task answers `409 TASK_CLOSED`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/document-tasks/{taskUuid}/uploads/{uploadUuid}/file:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - $ref: "#/components/parameters/DocumentTaskUuid"
      - $ref: "#/components/parameters/DocumentTaskUploadUuid"
    get:
      tags: [DocumentTasks]
      operationId: downloadTenantDocumentTaskUpload
      summary: Download a file the mükellef uploaded
      description: Requires `tenant.doc_tasks.read`. Always served as an attachment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/document-tasks:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
    get:
      tags: [DocumentTasks, TaxpayerPortal]
      operationId: listTaxpayerDocumentTasks
      summary: My document tasks (soonest due first)
      description: |
        Tasks of the mükellef's active engagement only; an earlier office's
        tasks are not listed. Any mükellef member (owner, employee) may read.
        `status` defaults to `open`.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, submitted, matched, cancelled, all], default: open } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTaskList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`NO_TAXPAYER_MEMBERSHIP`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/document-tasks/{taskUuid}:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
      - $ref: "#/components/parameters/DocumentTaskUuid"
    get:
      tags: [DocumentTasks, TaxpayerPortal]
      operationId: getTaxpayerDocumentTask
      summary: One of my document tasks with its uploads
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTask" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`NO_TAXPAYER_MEMBERSHIP`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/document-tasks/{taskUuid}/uploads:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
      - $ref: "#/components/parameters/DocumentTaskUuid"
    post:
      tags: [DocumentTasks, TaxpayerPortal]
      operationId: uploadTaxpayerDocumentTask
      summary: Upload a photo or PDF for a task
      description: |
        Accepts JPEG, PNG, WebP, HEIC or PDF (checked by content, max 20 MB).
        The file is stored as an attachment (deduplicated by SHA-256), matched
        to the task's bank transaction and the control re-runs, so the
        `BNK_*` warning becomes `auto_resolved` and the task `matched`. If the
        bank transaction was cancelled meanwhile, the task becomes
        `submitted` for the office to review. A matched or cancelled task
        answers `409 TASK_CLOSED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded (and matched)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeDocumentTaskUploadResult" }
        "400":
          description: "`FILE_REQUIRED`, `FILE_EMPTY`, `FILE_UNREADABLE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`NO_TAXPAYER_MEMBERSHIP`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: File too large (`UPLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not an image or PDF (`UNSUPPORTED_FILE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
