    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
    get:
      tags: [TaxpayerPortal]
      operationId: listTaxpayerUploads
      summary: Kullanıcının kendi belge yüklemeleri
      description: |
        Mükellef web paneli (issue #39). Yalnızca `X-Taxpayer` ile seçilen şirketin verisi döner.
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUBLUploadJobList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`NO_TAXPAYER_MEMBERSHIP`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [TaxpayerPortal]
      operationId: createTaxpayerUpload
      summary: E-fatura XML / ZIP yükle
      description: |
        Dosya, şirketin aktif ofisi (engagement) adına ofis yüklemesiyle aynı
        hattan işlenir (XSD, GİB Schematron, eşleme, mükerrer kontrolü). Aktif
        ofis yoksa `409 NO_ACTIVE_ENGAGEMENT`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUBLUploadJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "`NO_ACTIVE_ENGAGEMENT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`UPLOAD_TOO_LARGE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`UNSUPPORTED_FILE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`NO_TAXPAYER_MEMBERSHIP`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

