        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/onboarding-requests/{uuid}/approve:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [TaxpayerOnboarding]
      operationId: approveTaxpayerOnboardingRequest
      summary: Owner approves an office's request
      description: Owners only. Opens the engagement (and ends one with another office, D2). The body names the privacy notice version shown (issue #57).
      security:
