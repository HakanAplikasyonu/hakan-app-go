# Belge talebi: ilk mükellefin ayrıntısından talep açılır; görev ekranı
# "Bekleniyor" durumuyla açılır ve mükellefe bildirim gider (#240).
appId: app.hakan.office
name: task-create
tags: [smoke]
---
- launchApp
- tapOn:
    id: "tab-clients"
- extendedWaitUntil:
    visible:
      id: "client-row"
    timeout: 20000
- tapOn:
    id: "client-row"
    index: 0
# Ayrıntının üstünde dönem kartları var (#833): düğme aşağıda kalabilir.
- scrollUntilVisible:
    element: "Belge iste"
    direction: DOWN
    timeout: 15000
- tapOn: "Belge iste"
- tapOn:
    id: "request-title"
- inputText: "Maestro duman testi"
- hideKeyboard
- tapOn:
    id: "due-7"
- tapOn:
    id: "request-submit"
- extendedWaitUntil:
    visible: "Bekleniyor"
    timeout: 15000
- assertVisible: "Maestro duman testi"
