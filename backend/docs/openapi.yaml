  /v1/tenant/vat-forecast:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
    get:
      tags: [VAT]
      operationId: listOfficeVATForecasts
      summary: Office VAT forecast (KDV erken uyarı)
      description: |
        Requires `tenant.vat.read`. One row per active engagement: hesaplanan − indirilecek − devreden KDV, filing deadline and days left. Without `tenant.engagements.read_all` only assigned engagements.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, description: "YYYY-MM; default this month (Europe/Istanbul)", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Forecasts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVATForecastOfficePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/vat-forecast:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [VAT]
      operationId: getEngagementVATForecast
      summary: In-period VAT forecast of a taxpayer
      description: |
        Requires `tenant.vat.read`, `tenant.engagements.read` and engagement access. Source: active, not deleted-at-source invoices of the period and their `invoice_tax_summaries`, converted to TL with `invoices.exchange_rate` (rounded per row). Outgoing = hesaplanan KDV (vat − tevkifat), incoming = indirilecek KDV (whole vat; the withheld part is reported as `input_withholding`, KDV2). Devreden KDV runs over earlier periods from the nearest opening carry-forward. Deadline: `due_day` (VAT_DEADLINE_NEAR param, default 28) of the next month, moved to Monday on weekends; public holidays are not applied.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, description: "YYYY-MM; default this month (Europe/Istanbul)", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVATForecast"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/vat-forecast/evaluate:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    post:
      tags: [VAT]
      operationId: evaluateEngagementVATForecast
      summary: Run the VAT warning rules
      description: |
        Requires `tenant.vat.write`. Applies `VAT_PAYABLE_THRESHOLD` (payable ≥ `limit`; null limit = off) and `VAT_DEADLINE_NEAR` (0 ≤ days left ≤ `days_before`) on the period entity, producer `control:vat_forecast`. Conditions that no longer hold are auto-resolved. Without `period`: last month and this month.
      security:
        - bearerAuth: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: What the engine did per period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVATEvaluation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/vat-forecast/openings:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
    get:
      tags: [VAT]
      operationId: listEngagementVATOpenings
      summary: Opening carry-forwards (açılış devreden KDV)
      description: |
        Requires `tenant.vat.read`. Manually entered devreden KDV into a period; the chain restarts from the nearest one at or before the forecast period.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Openings, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVATOpeningList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/engagements/{engagementUuid}/vat-forecast/openings/{period}:
    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - $ref: "#/components/parameters/EngagementUuid"
      - { name: period, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
    put:
      tags: [VAT]
      operationId: putEngagementVATOpening
      summary: Set the opening carry-forward into a period
      description: |
        Requires `tenant.vat.write`. `amount` is a decimal string ≥ 0 with at most two decimals (TL). Logged to the activity log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VATOpeningInput"
      responses:
        "200":
          description: Opening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVATOpening"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [VAT]
      operationId: deleteEngagementVATOpening
      summary: Remove the opening carry-forward of a period
      description: |
        Requires `tenant.vat.write`. Logged to the activity log.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/EngagementForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BankConnectionUuid:
      name: connectionUuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceConnectionUuid:
      name: connectionUuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    EngagementUuid:
      name: engagementUuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    XTaxpayer:
      name: X-Taxpayer
      in: header
      required: true
      description: |
        Mükellef (taxpayer uuid) of a `/v1/taxpayer/*` request. The BFF
        forwards it on `/api/v1/taxpayer/*` only.
      schema: { type: string, format: uuid }
    XOrganization:
      name: X-Organization
      in: header
      required: true
      description: |
        Organization of a `/v1/tenant/*` request: its slug (preferred, readable
        in logs) or uuid. The BFF forwards it on `/api/v1/tenant/*` only.
      schema: { type: string, maxLength: 64, example: acme }
    QRSessionID:
      name: id
      in: path
      required: true
      description: QR sign-in session id (from the QR URL)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    UserUUID:
      name: userUuid
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

    PeriodPath:
      name: period
      in: path
      required: true
      description: Dönem (YYYY-MM)
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }

    ChangeRequestUuid:
      name: changeRequestUuid
      in: path
      required: true
      schema: { type: string, format: uuid }

    DocumentTaskUuid:
      name: taskUuid
      in: path
      required: true
      schema: { type: string, format: uuid }

    DocumentTaskUploadUuid:
      name: uploadUuid
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrganizationRequired:
      description: "`ORGANIZATION_REQUIRED`: the `X-Organization` header is missing or empty"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TenantForbidden:
      description: |
        `NO_TENANT_MEMBERSHIP` (unknown organization or not a member),
        `ORGANIZATION_SUSPENDED`, `ORGANIZATION_ACCESS_EXPIRED`, or `FORBIDDEN`
        (tenant permission missing in this organization)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EngagementForbidden:
      description: |
        `NO_ENGAGEMENT_ACCESS` (unknown engagement, another office's
        engagement, or no assignment and no `tenant.engagements.read_all`),
        `ENGAGEMENT_ENDED`, or any `TenantForbidden` code
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    BillingPlan:
      type: object
      required: [name, base_fee, per_taxpayer_fee, included_taxpayers, vat_rate, active]
      properties:
        code: { type: string, readOnly: true }
        name: { type: string }
        currency: { type: string, default: TRY }
        base_fee: { type: string, description: "Office base fee per month" }
        per_taxpayer_fee: { type: string, description: "Per active taxpayer above included_taxpayers" }
        included_taxpayers: { type: integer }
        vat_rate: { type: string, example: "20" }
        active: { type: boolean }
    BillingAccount:
      type: object
      required: [plan, read_only]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        read_only: { type: boolean }
        read_only_reason: { type: string }
    BillingTaxpayer:
      type: object
      required: [uuid, title, tax_id]
      properties:
        uuid: { type: string, format: uuid }
        title: { type: string }
        tax_id: { type: string }
    BillingAmounts:
      type: object
      required: [active_taxpayers, billable_taxpayers, base_fee, taxpayer_fee_total, subtotal, vat_rate, vat_amount, total, lines]
      properties:
        active_taxpayers: { type: integer }
        billable_taxpayers: { type: integer }
        base_fee: { type: string }
        taxpayer_fee_total: { type: string }
        subtotal: { type: string }
        vat_rate: { type: string }
        vat_amount: { type: string }
        total: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [code, description, quantity, unit_price, amount]
            properties:
              code: { type: string, enum: [base, taxpayer] }
              description: { type: string }
              quantity: { type: integer }
              unit_price: { type: string }
              amount: { type: string }
    BillingStatement:
      type: object
      required: [uuid, period, status, plan_code, currency, amounts, taxpayers, generated_at]
      properties:
        uuid: { type: string, format: uuid }
        period: { type: string }
        status: { type: string, enum: [draft, final, void] }
        plan_code: { type: string }
        currency: { type: string }
        amounts: { $ref: "#/components/schemas/BillingAmounts" }
        taxpayers: { type: array, items: { $ref: "#/components/schemas/BillingTaxpayer" } }
        generated_at: { type: string, format: date-time }
    BillingOverview:
      type: object
      required: [account, current, estimate, statements]
      properties:
        account: { $ref: "#/components/schemas/BillingAccount" }
        current:
          type: object
          required: [period, active_taxpayers, taxpayers]
          properties:
            period: { type: string }
            active_taxpayers: { type: integer }
            taxpayers: { type: array, items: { $ref: "#/components/schemas/BillingTaxpayer" } }
        estimate: { $ref: "#/components/schemas/BillingAmounts" }
        statements: { type: array, items: { $ref: "#/components/schemas/BillingStatement" } }
    EnvelopeBillingPlan:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BillingPlan" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeBillingAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BillingAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeBillingStatement:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BillingStatement" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeBillingOverview:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BillingOverview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeBillingPlanList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: 
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    BankCredentialField:
      type: object
      required: [key, label, secret]
      properties:
        key: { type: string }
        label: { type: string }
        secret: { type: boolean }
        pattern: { type: string }
        help: { type: string }
    BankService:
      type: object
