# Kaydırarak onay (arayüz v1, #327): kuyruktaki ilk kart alt "Onayla"
# düğmesiyle onaylanır (kaydırma hareketinin erişilebilir eşi). Kuyruk boşsa
# yalnızca boş durum denetlenir (demo verisinde bekleyen öneri olmalı).
appId: app.hakan.office
name: review-approve
tags: [smoke]
---
- launchApp
- openLink: "hakanofis://review"
- extendedWaitUntil:
    visible: "Onay"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "suggestion-card"
    commands:
      - assertVisible:
          id: "review-remaining"
      - tapOn:
          id: "review-approve"
      - extendedWaitUntil:
          visible: ".*onaylandı.*"
          timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "suggestion-card"
    commands:
      - assertVisible: "Kuyruk boş"
