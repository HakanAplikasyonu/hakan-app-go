      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
            - MFA_REQUIRED
            - INVALID_MFA_CODE
            - RATE_LIMITED
            - STEP_UP_REQUIRED
            - ACCOUNT_DEACTIVATED
            - INVALID_EMAIL_CODE
            - INVALID_ID_TOKEN
            - OAUTH_ACCOUNT_NOT_LINKED
            - OAUTH_LINK_CHOICE_REQUIRED
            - INVALID_LINK_TICKET
            - OAUTH_PROVIDER_DISABLED
            - ORGANIZATION_REQUIRED
            - NO_TENANT_MEMBERSHIP
            - ORGANIZATION_SUSPENDED
            - ORGANIZATION_ACCESS_EXPIRED
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

