# Pano (arayüz v1, #327): dönem tacı, onay kuyruğu kartı ve üç sayaç gerçek
# API'den dolar; alt sekmeler açılır; derin bağlantı hakanofis://warnings
# uyarılar ekranını açar (#241).
appId: app.hakan.office
name: dashboard
tags: [smoke]
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "stat-uploads"
    timeout: 20000
- assertVisible:
    id: "period-crown"
- assertVisible:
    id: "stat-tasks"
- assertVisible:
    id: "stat-warnings"
- tapOn:
    id: "tab-notifications"
- assertVisible: "Bildirimler"
- assertVisible:
    id: "inbox-filter-blocker"
- tapOn:
    id: "tab-clients"
- assertVisible:
    id: "clients-search"
- openLink: "hakanofis://warnings"
- assertVisible: "Uyarılar"
- back
