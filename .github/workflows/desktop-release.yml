# HAKAN (#50): masaüstü sürüm derlemesi. macOS (universal, imzalı + notarize)
# ve Windows (imzalı) paketleri üretir ve iş çıktısı (artifact) olarak yükler.
#
# Tetikleyiciler: elle (workflow_dispatch) ya da `desktop-v*` etiketi.
# Sırlar yoksa iş düşmez; imzasız paket üretir ve özetine yazar.
#
# Gerekli sırlar (Settings › Secrets):
#   macOS:   APPLE_CERTIFICATE (p12, base64), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (uygulamaya özel),
#            APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (pfx, base64), WINDOWS_CERTIFICATE_PASSWORD
#   Güncelleyici: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   ve değişken (Variables) TAURI_UPDATER_PUBKEY
name: desktop-release

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      HAKAN_DESKTOP_VERSION: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/sidecar/go.mod
          cache-dependency-path: |
            desktop/sidecar/go.sum
            backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install
        run: npm ci
      - name: Version from tag
        if: env.HAKAN_DESKTOP_VERSION != ''
        run: |
          v="${HAKAN_DESKTOP_VERSION#desktop-v}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "HAKAN_DESKTOP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build sidecar
        run: npm run sidecar -- ${{ matrix.target }}

      - name: Signing config
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          overlay='{}'
          signed=false
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            # Tauri, APPLE_CERTIFICATE* ile geçici anahtar zinciri kurar ve
            # sidecar dahil bütün ikilileri imzalar; APPLE_ID varsa notarize eder.
            signed=true
            [ -n "$APPLE_ID" ] || echo "::warning::APPLE_ID yok: imzalı ama notarize edilmemiş paket."
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String \$env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText; (Import-PfxCertificate -FilePath '$RUNNER_TEMP\\cert.pfx' -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint")
            rm -f "$RUNNER_TEMP/cert.pfx"
            overlay=$(jq -cn --arg t "$thumb" '{bundle:{windows:{certificateThumbprint:$t}}}')
            signed=true
          fi
          release=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            release=true
            overlay=$(jq -cn --argjson o "$overlay" --arg k "$UPDATER_PUBKEY" \
              '$o * {plugins:{updater:{pubkey:$k}}}')
          fi
          echo "overlay=$overlay" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.target }}"
            echo "- imzalı: $signed"
            echo "- güncelleyici paketi: $release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tauri build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OVERLAY: ${{ steps.sign.outputs.overlay }}
          RELEASE: ${{ steps.sign.outputs.release }}
        run: |
          set -euo pipefail
          args=(build --target "${{ matrix.target }}" --config "$OVERLAY")
          if [ "$RELEASE" = "true" ]; then
            args+=(--config src-tauri/tauri.release.conf.json)
          fi
          npx tauri "${args[@]}"

      - name: Signature check
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
            codesign -dv --verbose=2 "$app" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            codesign -dv "$app/Contents/MacOS/hakan-sidecar" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            spctl -a -vvv -t exec "$app" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            for f in src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe; do
              powershell -NoProfile -Command "Get-AuthenticodeSignature '$f' | Format-List Status,SignerCertificate" | tee -a "$GITHUB_STEP_SUMMARY" || true
            done
          fi

      # Kabul (#50): imzalı derleme açılıyor ve sidecar ile konuşuyor.
      - name: Self-test (signed build talks to sidecar)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
            out=$("$app/Contents/MacOS/hakan-desktop" --self-test | grep -E '^\{.*"ok":' | tail -1)
          else
            out=$(src-tauri/target/${{ matrix.target }}/release/hakan-desktop.exe --self-test | grep -E '^\{.*"ok":' | tail -1)
          fi
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -e '.ok == true' >/dev/null

      - uses: actions/upload-artifact@v5
        with:
          name: hakan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
          if-no-files-found: error
