# Profil ve çıkış: sürüm etiketi görünür, çıkış giriş ekranına döner.
appId: app.hakan.mukellef
name: signout
tags: [smoke]
---
- launchApp
- tapOn:
    id: "tab-profile"
# Profil uzun olabilir (destek, bordro belgeleri): sürüm etiketi en altta.
- scrollUntilVisible:
    element:
      id: "app-version"
- assertVisible:
    id: "app-version"
- takeScreenshot: mukellef-profil
- tapOn: "Çıkış yap"
- extendedWaitUntil:
    visible: "Giriş yap"
    timeout: 15000
