# Giriş: ofis kullanıcısının e-postası ve parolası ortamdan gelir:
#   maestro test -e MAESTRO_EMAIL=... -e MAESTRO_PASSWORD=... .maestro
appId: app.hakan.office
name: login
tags: [smoke]
---
- launchApp:
    clearState: true
- assertVisible: "Giriş yap"
# Ekran görüntüleri (#332): CI'da maestro-<uygulama> artefaktının screenshots/ klasörü.
- takeScreenshot: musavir-giris
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "Giriş yap"
- extendedWaitUntil:
    visible:
      text: "Ofis seçin|Bugün gelen yüklemeler"
    timeout: 20000
