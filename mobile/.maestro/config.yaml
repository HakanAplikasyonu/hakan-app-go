# Maestro duman akışları (#203). Çalıştırma: mobile/README.md, "Duman testleri".
# Sıra önemlidir: giriş → şirket seçimi → fiş çek → fiş önizlemesi → görevler → ofisin belge istekleri → bordro belgeleri → belgelerim ve belge görüntüleyici → yabancı fatura ve KDV → mesajlarım → çıkış.
flows:
  - flows/*.yaml
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - login
    - select-taxpayer
    - capture
    - fis-onizleme
    - tasks
    - belge-istekleri
    - payroll
    - belgeler
    - yabanci-fatura
    - mesajlar
    - signout
