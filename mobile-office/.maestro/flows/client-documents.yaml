# Mükellef belgeleri (#393): demo mükellefi Atlas Gıda'nın ayrıntısından
# Belgeler → Bordro sekmesi açılır; dönem bordrosu ve personel bazında
# bordro PDF'leri görünür. Mizan sekmesinde son mizan önceki dönemle
# karşılaştırılır. İSG sekmesi yaklaşan bitiş uyarısını gösterir; Evrak
# sekmesinde arama çalışır.
appId: app.hakan.office
name: client-documents
tags: [smoke]
---
- launchApp
- tapOn:
    id: "tab-clients"
- tapOn:
    id: "clients-search"
- inputText: "Atlas"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "client-row"
    timeout: 20000
- tapOn:
    id: "client-row"
    index: 0
- scrollUntilVisible:
    element:
      id: "client-documents-payroll"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "client-documents-payroll"
- extendedWaitUntil:
    visible:
      id: "payroll-tab"
    timeout: 15000
- assertVisible:
    id: "payroll-document"
- takeScreenshot: musavir-bordro
- tapOn:
    id: "documents-tab-mizan"
- extendedWaitUntil:
    visible:
      id: "mizan-line"
    timeout: 15000
- assertVisible:
    id: "mizan-compare"
- takeScreenshot: musavir-mizan
- tapOn:
    id: "documents-tab-isg"
- extendedWaitUntil:
    visible:
      id: "isg-warning"
    timeout: 15000
- assertVisible:
    id: "archive-document"
- takeScreenshot: musavir-isg
- tapOn:
    id: "documents-tab-archive"
- extendedWaitUntil:
    visible:
      id: "archive-tab"
    timeout: 15000
- tapOn:
    id: "archive-search"
- inputText: "kira"
- hideKeyboard
- extendedWaitUntil:
    visible: "Depo kira sözleşmesi"
    timeout: 15000
- takeScreenshot: musavir-evrak
