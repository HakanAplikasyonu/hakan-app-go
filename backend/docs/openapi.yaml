        source_kind: { type: string, enum: [account_plan, trial_balance] }
        file_name: { type: string }
        sha256: { type: string }
        account_count: { type: integer }
        skipped_rows: { type: integer }
        created_at: { type: string, format: date-time }

    AccountPlanAccount:
      type: object
      required: [code, name, main_code, level, is_leaf]
      properties:
        code: { type: string, examples: ["120.01.001"] }
        name: { type: string }
        main_code: { type: string, examples: ["120"] }
        level: { type: integer }
        is_leaf: { type: boolean }

    EnvelopeAccountPlanImportResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [import, header_row, duplicates, skipped]
          properties:
            import: { $ref: "#/components/schemas/AccountPlanImport" }
            header_row: { type: integer, description: "1-based; 0 when no header row was found" }
            duplicates: { type: integer }
            skipped:
              type: array
              description: First 20 rows without a usable account code
              items:
                type: object
                properties:
                  row: { type: integer }
                  value: { type: string }
                  reason: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountPlanImportList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountPlanImport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountPlanAccountPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountPlanAccount" }
            total: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountPlanCheck:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [plan_loaded, missing, non_leaf, invalid]
          properties:
            plan_loaded: { type: boolean }
            import: { $ref: "#/components/schemas/AccountPlanImport" }
            missing: { type: array, items: { type: string } }
            non_leaf: { type: array, items: { type: string } }
            invalid: { type: array, items: { type: string } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    Period:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      description: Dönem (YYYY-MM)
      example: "2026-10"

    PeriodLock:
      type: object
      required: [period, locked_at]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        note: { type: string }
        locked_by_uuid: { type: string, format: uuid }
        locked_at: { type: string, format: date-time }

    PeriodReadinessReason:
      type: object
      required: [code, count]
      properties:
        code: { type: string, enum: [OPEN_BLOCKER, OPEN_CHANGE_REQUESTS] }
        warning_code: { type: string, description: Warning code for OPEN_BLOCKER }
        count: { type: integer, format: int64 }

    PeriodReadiness:
      type: object
      required: [period, ready, locked, lock, open_blockers, open_change_requests, reasons]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        ready: { type: boolean, description: No open blocker and no open change request }
        locked: { type: boolean }
        lock:
          oneOf:
            - $ref: "#/components/schemas/PeriodLock"
            - type: "null"
        open_blockers: { type: integer, format: int64 }
        open_change_requests: { type: integer, format: int64 }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/PeriodReadinessReason" }

    PeriodLockInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }

    PeriodUnlockInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    PeriodLockEvent:
      type: object
      required: [uuid, period, action, actor_uuid, created_at]
      properties:
        uuid: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/Period" }
        action: { type: string, enum: [lock, unlock] }
        reason: { type: string }
        actor_uuid: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    ChangeRequest:
      type: object
      required: [uuid, period, entity_type, invoice_uuid, kind, old_hash, new_hash, diff, status, decided_by_uuid, decided_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/Period" }
        entity_type: { type: string, enum: [invoice] }
        invoice_uuid: { type: [string, "null"], format: uuid, description: "The invoice; null for a new invoice held back by the lock" }
        kind: { type: string, enum: [create, update] }
        old_hash: { type: [string, "null"] }
        new_hash: { type: [string, "null"] }
        diff:
          type: object
          description: "Fark özeti: kind, source {system, capture_method}, fields {name: {old, new}}"
          additionalProperties: true
        new_payload:
          type: object
          description: The held invoice (common model); only on the single-request read
          additionalProperties: true
        status: { type: string, enum: [open, applied, rejected] }
        decided_by_uuid: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PeriodMatrixCell:
      type: object
      required: [period, ready, locked, locked_at, open_blockers, open_change_requests]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        ready: { type: boolean }
        locked: { type: boolean }
        locked_at: { type: [string, "null"], format: date-time }
        open_blockers: { type: integer, format: int64 }
        open_change_requests: { type: integer, format: int64 }

    PeriodMatrixRow:
      type: object
      required: [engagement_uuid, taxpayer_uuid, taxpayer_title, taxpayer_tax_id, cells]
      properties:
        engagement_uuid: { type: string, format: uuid }
        taxpayer_uuid: { type: string, format: uuid }
        taxpayer_title: { type: string }
        taxpayer_tax_id: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/PeriodMatrixCell" }

    EnvelopePeriodReadiness:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PeriodReadiness" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePeriodLockEventList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PeriodLockEvent" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeChangeRequest:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ChangeRequest" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeChangeRequestPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ChangeRequest" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePeriodMatrix:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [periods, items, total, limit, offset]
          properties:
            periods:
              type: array
              items: { $ref: "#/components/schemas/Period" }
            items:
              type: array
              items: { $ref: "#/components/schemas/PeriodMatrixRow" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DocumentTaskBankTransaction:
      type: object
      required: [uuid, transaction_date, direction, amount, currency, counterparty_name, description]
      properties:
        uuid: { type: string, format: uuid }
        transaction_date: { type: string, format: date }
        direction: { type: string, enum: [in, out] }
        amount: { type: string, description: Decimal string, example: "1250.00" }
        currency: { type: string, example: TRY }
        counterparty_name: { type: [string, "null"] }
        description: { type: string }

    DocumentTaskUpload:
      type: object
      required: [uuid, attachment_uuid, kind, content_type, file_name, size_bytes, sha256, created_at]
      properties:
        uuid: { type: string, format: uuid }
        attachment_uuid: { type: string, format: uuid }
        kind: { type: string, enum: [image, pdf] }
        content_type: { type: [string, "null"] }
        file_name: { type: [string, "null"] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        created_at: { type: string, format: date-time }

    DocumentTask:
      type: object
      description: |
        A missing-document request. `reminder_count`, `last_reminded_at`,
        `next_reminder_at`, `cancelled_at` and `cancel_reason` are office
        only; `organization_name` is set on the mükellef side.
      required: [uuid, code, kind, period, status, note, due_at, overdue, submitted_at, matched_at, bank_transaction, upload_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string, enum: [BNK_UNDOCUMENTED_PAYMENT, BNK_UNINVOICED_COLLECTION] }
        kind: { type: string, enum: [undocumented_payment, uninvoiced_collection] }
        period: { type: string, example: "2026-10" }
        status: { type: string, enum: [open, submitted, matched, cancelled] }
        note: { type: string }
        due_at: { type: string, format: date-time }
        overdue: { type: boolean }
        organization_name: { type: string }
        reminder_count: { type: integer }
        last_reminded_at: { type: [string, "null"], format: date-time }
        next_reminder_at: { type: [string, "null"], format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        matched_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        bank_transaction: { $ref: "#/components/schemas/DocumentTaskBankTransaction" }
        upload_count: { type: integer, format: int64 }
        uploads:
          type: array
          description: Detail views only
          items: { $ref: "#/components/schemas/DocumentTaskUpload" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MissingDocumentDetection:
      type: object
      required: [checked, created, refreshed, suppressed, disabled, auto_resolved, tasks_closed]
      properties:
        checked: { type: integer }
        created: { type: integer }
        refreshed: { type: integer }
        suppressed: { type: integer }
        disabled: { type: integer }
        auto_resolved: { type: integer }
        tasks_closed: { type: integer }

    EnvelopeDocumentTask:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/DocumentTask" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeDocumentTaskList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/DocumentTask" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeMissingDocumentDetection:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/MissingDocumentDetection" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeDocumentTaskGenerate:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [created, notified]
          properties:
            detection: { $ref: "#/components/schemas/MissingDocumentDetection" }
            created: { type: integer }
            notified: { type: integer, description: Members notified }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeDocumentTaskUploadResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [task, upload, matched, warning_resolved]
          properties:
            task: { $ref: "#/components/schemas/DocumentTask" }
            upload: { $ref: "#/components/schemas/DocumentTaskUpload" }
            matched: { type: boolean }
            warning_resolved: { type: boolean }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AccountRuleConditions:
      type: object
      properties:
        direction: { type: string, enum: [incoming, outgoing] }
        invoice_type: { type: string, examples: [SATIS, IADE] }
        counterparty_tax_id: { type: string, description: VKN or TCKN }
        counterparty_name_contains: { type: string }
        item_name_contains: { type: array, items: { type: string }, maxItems: 20 }
        line_type: { type: string, enum: [goods, service, fixed_asset_candidate, discount, expense, unknown] }
        tax_rate: { type: string, examples: ["20"] }

    AccountRuleInput:
      type: object
      required: [account_code]
      properties:
        role: { type: string, enum: [line, vat, counterparty], default: line }
        priority: { type: integer, minimum: 1, maximum: 999, default: 100 }
        name: { type: string, maxLength: 200 }
        conditions: { $ref: "#/components/schemas/AccountRuleConditions" }
        account_code: { type: string, examples: ["770.01"] }
        confidence: { type: string, description: "0..1; default 0.96" }

    AccountRule:
      type: object
      required: [uuid, rule_key, version, status, scope, role, priority, name, conditions, account_code, confidence, origin, created_at]
      properties:
        uuid: { type: string, format: uuid, description: This version }
        rule_key: { type: string, format: uuid, description: Stable id across versions }
        version: { type: integer }
        status: { type: string, enum: [active, retired] }
        scope: { type: string, enum: [office, engagement] }
        role: { type: string, enum: [line, vat, counterparty] }
        priority: { type: integer }
        name: { type: string }
        conditions: { $ref: "#/components/schemas/AccountRuleConditions" }
        account_code: { type: string }
        confidence: { type: string }
        origin: { type: string, enum: [manual, candidate, template] }
        created_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time }

    AccountRuleCandidate:
      type: object
      properties:
        counterparty_key: { type: string, description: "VKN/TCKN, or name:<folded name>" }
        counterparty_name: { type: string }
        direction: { type: string }
        account_code: { type: string }
        decisions: { type: integer }
        last_decided_at: { type: string, format: date-time }
        question: { type: string }

    AccountRulePromoteInput:
      type: object
      required: [counterparty_key, account_code]
      properties:
        counterparty_key: { type: string }
        counterparty_name: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        account_code: { type: string }

    AccountSuggestion:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        target_type: { type: string, enum: [invoice_item, customer] }
        target_field: { type: string, enum: [account_code, vat_account_code] }
        line_no: { type: integer }
        account_code: { type: string }
        confidence: { type: string }
        status: { type: string }
        rationale: { type: string }
        rule_ref: { type: string }

    EnvelopeAccountRule:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AccountRule" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountRuleList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountRule" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountRuleCandidateList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountRuleCandidate" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountSuggestionList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountSuggestion" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountRuleCopy:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            copied: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VATMoney:
      type: string
      description: TL amount, two decimals
      example: "1234.50"

    VATTotals:
      type: object
      required: [output_vat, output_withholding, input_vat, input_withholding, carried_in, net, payable, carry_out, invoice_count]
      properties:
        output_vat:
          description: Hesaplanan KDV (satış KDV'si − satışta tevkif edilen)
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        output_withholding:
          description: Satışlarda alıcının tevkif ettiği KDV (bilgi)
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        input_vat:
          description: İndirilecek KDV (alış KDV'sinin tamamı)
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        input_withholding:
          description: Alışlarda tevkif edilen KDV (KDV2; KDV1 netine girmez)
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        carried_in:
          description: Önceki dönemden devreden KDV
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        net:
          description: output_vat − input_vat − carried_in
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        payable:
          description: max(net, 0), ödenecek KDV tahmini
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        carry_out:
          description: max(−net, 0), sonraki döneme devreden KDV
          allOf: [{ $ref: "#/components/schemas/VATMoney" }]
        invoice_count: { type: integer, format: int64 }

    VATCalendar:
      type: object
      required: [due_date, due_day, days_left, rolled_forward, holidays_checked]
      properties:
        due_date: { type: string, format: date }
        due_day: { type: integer }
        days_left: { type: integer, description: "Negative once the deadline has passed" }
        rolled_forward: { type: boolean, description: "Due day fell on a weekend and moved to Monday" }
        holidays_checked: { type: boolean, description: "Always false: public holidays are not applied yet" }

    VATChecks:
      type: object
      required: [payable_limit, payable_limit_reached, days_before, deadline_near]
      properties:
        payable_limit: { type: [string, "null"] }
        payable_limit_reached: { type: boolean }
        days_before: { type: integer }
        deadline_near: { type: boolean }

    VATExcluded:
      type: object
      required: [cancelled, draft, deleted_at_source, missing_exchange_rate]
      properties:
        cancelled: { type: integer, format: int64 }
        draft: { type: integer, format: int64 }
        deleted_at_source: { type: integer, format: int64 }
        missing_exchange_rate: { type: integer, format: int64 }

    VATForecast:
      type: object
      required: [period, engagement_uuid, taxpayer_uuid, currency, as_of, totals, rates, lines, carry_forward, calendar, checks, excluded]
      properties:
        period: { type: string }
        engagement_uuid: { type: string, format: uuid }
        taxpayer_uuid: { type: string, format: uuid }
        currency: { type: string, enum: [TRY] }
        as_of: { type: string, format: date }
        totals: { $ref: "#/components/schemas/VATTotals" }
        rates:
          type: array
          items:
            type: object
            required: [tax_rate, output_base, output_vat, output_withholding, input_base, input_vat, input_withholding]
            properties:
              tax_rate: { type: string }
              output_base: { $ref: "#/components/schemas/VATMoney" }
              output_vat: { $ref: "#/components/schemas/VATMoney" }
              output_withholding: { $ref: "#/components/schemas/VATMoney" }
              input_base: { $ref: "#/components/schemas/VATMoney" }
              input_vat: { $ref: "#/components/schemas/VATMoney" }
              input_withholding: { $ref: "#/components/schemas/VATMoney" }
        lines:
          type: array
          items:
            type: object
            required: [direction, type, tax_rate, withholding_code, invoice_count, base, vat, withholding, effective_vat]
            properties:
              direction: { type: string, enum: [outgoing, incoming] }
              type: { type: string }
              tax_rate: { type: string }
              withholding_code: { type: string }
              invoice_count: { type: integer, format: int64 }
              base: { $ref: "#/components/schemas/VATMoney" }
              vat: { $ref: "#/components/schemas/VATMoney" }
              withholding: { $ref: "#/components/schemas/VATMoney" }
              effective_vat: { $ref: "#/components/schemas/VATMoney" }
        carry_forward:
          type: object
          required: [source, opening_period, opening_amount, periods]
          properties:
            source: { type: string, enum: [opening, computed, none] }
            opening_period: { type: [string, "null"] }
            opening_amount: { type: [string, "null"] }
            periods: { type: array, items: { type: string } }
        calendar: { $ref: "#/components/schemas/VATCalendar" }
        checks: { $ref: "#/components/schemas/VATChecks" }
        excluded: { $ref: "#/components/schemas/VATExcluded" }

    EnvelopeVATForecast:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VATForecast" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVATForecastOfficePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                type: object
                required: [engagement_uuid, taxpayer_uuid, totals, calendar, checks, excluded]
                properties:
                  engagement_uuid: { type: string, format: uuid }
                  taxpayer_uuid: { type: string, format: uuid }
                  totals: { $ref: "#/components/schemas/VATTotals" }
                  calendar: { $ref: "#/components/schemas/VATCalendar" }
                  checks: { $ref: "#/components/schemas/VATChecks" }
                  excluded: { $ref: "#/components/schemas/VATExcluded" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
