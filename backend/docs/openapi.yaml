    parameters:
      - $ref: "#/components/parameters/XOrganization"
      - { name: agentUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Agents]
      operationId: heartbeatDesktopAgent
      summary: Desktop agent heartbeat
      description: |
        Requires `tenant.agents.write`. Sent every `heartbeat_seconds` (300). An agent silent for 30 minutes is marked `offline` by a scheduled sweep and the registering user is notified (`AGENT_OFFLINE`, 02 §6 / 05 §4); the next heartbeat brings it back `online`.
