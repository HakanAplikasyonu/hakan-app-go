# HAKAN (#50): masaüstü sürüm derlemesi. macOS (universal, imzalı + notarize)
# ve Windows (imzalı) paketleri üretir, iş çıktısı (artifact) olarak ve
# `desktop-vX.Y.Z` GitHub Release'ine yükler. Ofis panelindeki "Masaüstü
# ajanları" sayfası indirme bağlantılarını en yeni `desktop-v*` sürümünden alır.
#
# Sunucu adresi: sidecar'a derleme zamanında gömülür (HAKAN_API_BASE_URL,
# scripts/build-sidecar.mjs). Sıra: elle çalıştırmada `api_base_url` girdisi >
# depo değişkeni (Variables) HAKAN_API_BASE_URL > https://api.hakan.crmeasytradetr.com.
# Kullanıcı uygulamada adresi değiştirebilir.
#
# Tetikleyiciler: elle (workflow_dispatch) ya da `desktop-v*` etiketi.
# Sırlar yoksa iş düşmez; imzasız paket üretir ve özetine yazar.
#
# Kanallar (#183): `desktop-vX.Y.Z` kararlı (stable), `desktop-vX.Y.Z-beta.N`
# beta. Güncelleyici her kanalda kendi manifestine bakar (bkz.
# desktop/scripts/updater-manifest.mjs). `TAURI_UPDATER_BASE_URL` değişkeni
# verilirse manifest ve paketler <base>/<kanal>/ altında aranır; verilmezse
# GitHub Release adresleri kullanılır. Manifest (latest.json) yalnızca iş
# çıktısı olarak üretilir; hiçbir yere yayımlanmaz.
#
# Gerekli sırlar (Settings › Secrets):
#   macOS:   APPLE_CERTIFICATE (p12, base64), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (uygulamaya özel),
#            APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (pfx, base64), WINDOWS_CERTIFICATE_PASSWORD
#   Güncelleyici: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   ve değişkenler (Variables) TAURI_UPDATER_PUBKEY, isteğe bağlı TAURI_UPDATER_BASE_URL
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Uygulamaya gömülecek sunucu (API) adresi"
        required: false
        default: "https://api.hakan.crmeasytradetr.com"
      publish:
        description: "GitHub Release'e yükle (desktop-v<package.json sürümü>)"
        type: boolean
        default: true
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    env:
      HAKAN_DESKTOP_VERSION: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
      HAKAN_API_BASE_URL: ${{ inputs.api_base_url || vars.HAKAN_API_BASE_URL || 'https://api.hakan.crmeasytradetr.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/sidecar/go.mod
          cache-dependency-path: |
            desktop/sidecar/go.sum
            backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install
        run: npm ci
      - name: Version from tag
        if: env.HAKAN_DESKTOP_VERSION != ''
        run: |
          v="${HAKAN_DESKTOP_VERSION#desktop-v}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "HAKAN_DESKTOP_VERSION=$v" >> "$GITHUB_ENV"
      # Sürüm package.json'dan (etiket varsa yukarıda yazıldı); ön sürüm eki
      # (-beta.N) beta kanalını seçer.
      - name: Channel
        id: channel
        env:
          BASE_URL: ${{ vars.TAURI_UPDATER_BASE_URL }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          ch="$(node --input-type=module -e "import { channelFor } from './scripts/updater-manifest.mjs'; console.log(channelFor('$v'))")"
          ep="$(node --input-type=module -e "import { endpointFor } from './scripts/updater-manifest.mjs'; console.log(endpointFor('$ch', process.env.BASE_URL ?? ''))")"
          {
            echo "version=$v"
            echo "channel=$ch"
            echo "endpoint=$ep"
          } >> "$GITHUB_OUTPUT"
          echo "- sürüm: $v · kanal: $ch · güncelleme adresi: $ep · sunucu: $HAKAN_API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Build sidecar
        run: npm run sidecar -- ${{ matrix.target }}

      - name: Signing config
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          UPDATER_BASE_URL: ${{ vars.TAURI_UPDATER_BASE_URL }}
        run: |
          set -euo pipefail
          overlay='{}'
          signed=false
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            # Tauri, APPLE_CERTIFICATE* ile geçici anahtar zinciri kurar ve
            # sidecar dahil bütün ikilileri imzalar; APPLE_ID varsa notarize eder.
            signed=true
            [ -n "$APPLE_ID" ] || echo "::warning::APPLE_ID yok: imzalı ama notarize edilmemiş paket."
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String \$env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText; (Import-PfxCertificate -FilePath '$RUNNER_TEMP\\cert.pfx' -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint")
            rm -f "$RUNNER_TEMP/cert.pfx"
            overlay=$(jq -cn --arg t "$thumb" '{bundle:{windows:{certificateThumbprint:$t}}}')
            signed=true
          fi
          release=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            release=true
            # Uygulama anahtarı ve adresi derleme zamanında env'den okur
            # (#205, src/updater.rs); config'deki anahtar paket imzası içindir.
            overlay=$(jq -cn --argjson o "$overlay" --arg k "$UPDATER_PUBKEY" \
              '$o * {plugins:{updater:{pubkey:$k}}}')
          fi
          app_updater=false
          if [ -n "$UPDATER_PUBKEY" ] && [ -n "$UPDATER_BASE_URL" ]; then
            app_updater=true
          fi
          echo "overlay=$overlay" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.target }}"
            echo "- imzalı: $signed"
            echo "- güncelleyici paketi: $release"
            echo "- uygulamada otomatik güncelleme: $app_updater (TAURI_UPDATER_PUBKEY + TAURI_UPDATER_BASE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tauri build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Derleme zamanı (#205): ikisi de yoksa uygulamada güncelleme kapalı.
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_BASE_URL: ${{ vars.TAURI_UPDATER_BASE_URL }}
          OVERLAY: ${{ steps.sign.outputs.overlay }}
          RELEASE: ${{ steps.sign.outputs.release }}
        run: |
          set -euo pipefail
          args=(build --target "${{ matrix.target }}" --config "$OVERLAY")
          if [ "$RELEASE" = "true" ]; then
            args+=(--config src-tauri/tauri.release.conf.json)
          fi
          npx tauri "${args[@]}"

      - name: Signature check
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
            codesign -dv --verbose=2 "$app" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            codesign -dv "$app/Contents/MacOS/hakan-sidecar" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            spctl -a -vvv -t exec "$app" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            for f in src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe; do
              powershell -NoProfile -Command "Get-AuthenticodeSignature '$f' | Format-List Status,SignerCertificate" | tee -a "$GITHUB_STEP_SUMMARY" || true
            done
          fi

      # Kabul (#50): imzalı derleme açılıyor ve sidecar ile konuşuyor.
      - name: Self-test (signed build talks to sidecar)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
            out=$("$app/Contents/MacOS/hakan-desktop" --self-test | grep -E '^\{.*"ok":' | tail -1)
          else
            out=$(src-tauri/target/${{ matrix.target }}/release/hakan-desktop.exe --self-test | grep -E '^\{.*"ok":' | tail -1)
          fi
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -e '.ok == true' >/dev/null

      - uses: actions/upload-artifact@v5
        with:
          name: hakan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
          if-no-files-found: error

  # Güncelleyici manifesti (#183): imzalı güncelleme paketleri varsa kanal
  # başına latest.json üretir ve iş çıktısı olarak yükler. Yayımlamaz:
  # GitHub Release ya da depolamaya koymak ayrı bir karardır.
  manifest:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
      - uses: actions/download-artifact@v5
        with:
          pattern: hakan-desktop-*
          path: ${{ runner.temp }}/bundles
      - name: latest.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          BASE_URL: ${{ vars.TAURI_UPDATER_BASE_URL }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', needs.build.outputs.version) }}
        run: |
          set -euo pipefail
          if ! find "$RUNNER_TEMP/bundles" -name '*.sig' | grep -q .; then
            echo "İmzalı güncelleme paketi yok (TAURI_SIGNING_PRIVATE_KEY / TAURI_UPDATER_PUBKEY): manifest atlandı." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/updater-manifest.mjs --dir "$RUNNER_TEMP/bundles" --version "$VERSION" \
            --channel "$CHANNEL" --tag "$TAG" --base-url "${BASE_URL:-}" \
            --notes "HAKAN masaüstü $VERSION" --out "$RUNNER_TEMP/latest.json"
          { echo '```json'; cat "$RUNNER_TEMP/latest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: hakan-desktop-updater-${{ needs.build.outputs.channel }}
          path: ${{ runner.temp }}/latest.json
          if-no-files-found: ignore

  # İndirme sayfası (Ofis › Masaüstü ajanları) için GitHub Release. Etiketle
  # tetiklenince o etikete, elle çalıştırmada `desktop-v<sürüm>` etiketine
  # (yoksa bu commit'te oluşturulur) yükler. İmza sırrı gerekmez: imzasız
  # paketler de yüklenir; sayfa imzasız açma adımlarını anlatır.
  release:
    needs: [build, manifest]
    if: >-
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/desktop-v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: hakan-desktop-*
          path: ${{ runner.temp }}/bundles
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', needs.build.outputs.version) }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/bundles" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.sig' -o -name '*.app.tar.gz' -o -name 'latest.json' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Yüklenecek paket yok."
            exit 1
          fi
          flags=()
          [ "$CHANNEL" = "stable" ] || flags+=(--prerelease)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "HAKAN masaüstü $VERSION" \
              --notes "HAKAN masaüstü ajanı $VERSION. macOS: .dmg, Windows: .msi ya da .exe." "${flags[@]}"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          {
            echo "### GitHub Release: $TAG"
            for f in "${files[@]}"; do echo "- $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
