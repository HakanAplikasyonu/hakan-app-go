# İstekler, Geçmiş ve Bildirimler (arayüz v1, #328): alt sekmeler açılır;
# hakan://tasks derin bağlantısı İstekler sekmesini açar (#201).
appId: app.hakan.mukellef
name: tasks
tags: [smoke]
---
- launchApp
- tapOn:
    id: "tab-tasks"
- assertVisible: "İstekler"
- assertVisible:
    id: "tasks-tab-tamam"
- tapOn:
    id: "tab-history"
- assertVisible: "Geçmiş"
- tapOn:
    id: "history-tab-fatura"
- tapOn:
    id: "tab-index"
- tapOn:
    id: "open-notifications"
- assertVisible: "Bildirimler"
- back
- openLink: "hakan://tasks"
- assertVisible: "İstekler"
