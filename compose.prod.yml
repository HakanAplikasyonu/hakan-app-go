# Production stack (Dokploy compose or plain `docker compose`).
#
# Networks — every app gets its own:
#   app             Private bridge network created by Compose, named
#                   ${APP_NETWORK_NAME:-<NAME_PREFIX>-app}. All services join it.
#   dokploy-network Shared reverse-proxy network (external; Dokploy creates it,
#                   on a plain Docker host run once: docker network create dokploy-network).
#                   Only the public services join it: frontend and centrifugo.
#
# NAME_PREFIX is required: it makes container, volume and network names unique
# per app, so several boilerplate apps run side by side on one server.
# Internal hosts are always qualified as <service>.<app network>: a bare name
# like `backend` could resolve to another stack's container on dokploy-network.
name: ${COMPOSE_PROJECT_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod}

# App images are built and published by CI (.github/workflows/ci.yml) and
# listed in deploy/images.json. The server does NOT build them: it pulls the
# tags named by BACKEND_IMAGE / FRONTEND_IMAGE (CI pushes them to GHCR; Dokploy
# deploys on v0.* tags). IMAGE_PULL_POLICY defaults to "always" so every
# redeploy fetches the current tag; set it to "missing" to reuse a cached image
# (e.g. when smoke-testing a locally built image).
x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  pull_policy: ${IMAGE_PULL_POLICY:-always}

x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
  pull_policy: ${IMAGE_PULL_POLICY:-always}

# Sabit çıkış IP'si isteyen hostlar (issue #256): İşNet e-fatura servisleri ve
# Vakıfbank hesap hareketi servisi (docs/kaynak 32 §1, 22 §1), artı IP
# denetiminin hostu ve TCMB döviz kurları (www.tcmb.gov.tr/kurlar, #780).
# Backend ve worker yalnızca bu hostlar için egress vekiline gider;
# egress-proxy de yalnızca bunlara izin verir.
x-egress-proxy-hosts: &egress-proxy-hosts ${EGRESS_PROXY_HOSTS:-einvoiceservicetest.isnet.net.tr,einvoiceservice.isnet.net.tr,vbtestservice.vakifbank.com.tr,vbservice.vakifbank.com.tr,api.ipify.org,www.tcmb.gov.tr}

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-api}
  APP_ENV: production
  APP_HTTP_ADDR: :8080
  # Operator tunables below use KEY: ${KEY:-}: empty keeps the Go default.
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
  # Empty = loopback + private ranges (the BFF reaches the API over the app network).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  DB_HOST: postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-}
  DB_RLS_RUNTIME: ${DB_RLS_RUNTIME:-}
  # force_custom_plan (default) or auto; see docs/performans.md (#182).
  DB_PLAN_CACHE_MODE: ${DB_PLAN_CACHE_MODE:-}
  DB_RLS_REQUEST_SCOPE: ${DB_RLS_REQUEST_SCOPE:-}
  REDIS_ADDR: redis.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-}
  # SeaweedFS is private: browsers get files through API endpoints, never a bucket URL.
  S3_ENDPOINT: http://seaweedfs.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_PATH_STYLE: "true"
  CENTRIFUGO_API_URL: http://centrifugo.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
  CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
  CENTRIFUGO_WS_URL: ${CENTRIFUGO_WS_URL:?CENTRIFUGO_WS_URL is required}
  CENTRIFUGO_TOKEN_TTL: ${CENTRIFUGO_TOKEN_TTL:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
  AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:?AUTH_ADAPTER_SECRET is required}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
  # Sır kasası KEK listesi ve etkin anahtar (backend/docs/sir-kasasi.md). Boşsa kasa
  # APP_ENCRYPTION_KEY ile çalışır (KEK kimliği "app").
  SECRETS_KEYRING: ${SECRETS_KEYRING:-}
  SECRETS_ACTIVE_KEY_ID: ${SECRETS_ACTIVE_KEY_ID:-}
  # KVKK veri sahibi talepleri (docs/kvkk.md §7): muhasebe saklama süresi (yıl) ve
  # dışa aktarımın indirilebilir kalma süresi. Boş: 5 yıl, 168h.
  PRIVACY_ACCOUNTING_RETENTION_YEARS: ${PRIVACY_ACCOUNTING_RETENTION_YEARS:-}
  PRIVACY_EXPORT_TTL: ${PRIVACY_EXPORT_TTL:-}
  # Hız sınırlama ve kötüye kullanım koruması (#180, backend/docs/hiz-sinirlama.md).
  # Boş: varsayılanlar (auto depo; giriş 10/15m; yükleme 300 oturum, 600 IP / 10m;
  # 5 başarısız girişten sonra 30s'den 15m'ye artan bekleme).
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-}
  RATE_LIMIT_LOGIN_LIMIT: ${RATE_LIMIT_LOGIN_LIMIT:-}
  RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-}
  RATE_LIMIT_REGISTER_LIMIT: ${RATE_LIMIT_REGISTER_LIMIT:-}
  RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-}
  RATE_LIMIT_FORGOT_LIMIT: ${RATE_LIMIT_FORGOT_LIMIT:-}
  RATE_LIMIT_FORGOT_WINDOW: ${RATE_LIMIT_FORGOT_WINDOW:-}
  RATE_LIMIT_RESET_LIMIT: ${RATE_LIMIT_RESET_LIMIT:-}
  RATE_LIMIT_RESET_WINDOW: ${RATE_LIMIT_RESET_WINDOW:-}
  RATE_LIMIT_UPLOAD_USER_LIMIT: ${RATE_LIMIT_UPLOAD_USER_LIMIT:-}
  RATE_LIMIT_UPLOAD_USER_WINDOW: ${RATE_LIMIT_UPLOAD_USER_WINDOW:-}
  RATE_LIMIT_UPLOAD_IP_LIMIT: ${RATE_LIMIT_UPLOAD_IP_LIMIT:-}
  RATE_LIMIT_UPLOAD_IP_WINDOW: ${RATE_LIMIT_UPLOAD_IP_WINDOW:-}
  RATE_LIMIT_TEAM_INVITE_PREVIEW_LIMIT: ${RATE_LIMIT_TEAM_INVITE_PREVIEW_LIMIT:-}
  LOGIN_BACKOFF_THRESHOLD: ${LOGIN_BACKOFF_THRESHOLD:-}
  LOGIN_BACKOFF_IP_THRESHOLD: ${LOGIN_BACKOFF_IP_THRESHOLD:-}
  LOGIN_BACKOFF_BASE: ${LOGIN_BACKOFF_BASE:-}
  LOGIN_BACKOFF_MAX: ${LOGIN_BACKOFF_MAX:-}
  LOGIN_BACKOFF_WINDOW: ${LOGIN_BACKOFF_WINDOW:-}
  # Alan düzeyinde şifreleme KEK'i (ham banka/fatura verisi, backend/docs/alan-sifreleme.md).
  # APP_ENCRYPTION_KEY'den ayrıdır. Döndürme: KEYRING'e anahtar ekle, ACTIVE'i ayarla, field-crypt rotate.
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
  FIELD_ENCRYPTION_KEYRING: ${FIELD_ENCRYPTION_KEYRING:-}
  FIELD_ENCRYPTION_ACTIVE_KEY_ID: ${FIELD_ENCRYPTION_ACTIVE_KEY_ID:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  # Public origin for links the API generates (e-mail links, step-up
  # origin). Defaults to AUTH_URL.
  PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-${AUTH_URL:?AUTH_URL is required}}
  # Passkey relying-party ID; empty → hostname of PUBLIC_FRONTEND_URL.
  AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:-}
  # AI module (docs/01 G11). Keys only via env; empty key = AI off.
  KOLAYBI_BASE_URL: ${KOLAYBI_BASE_URL:-}
  KOLAYBI_CHANNEL: ${KOLAYBI_CHANNEL:-}
  EASYTRADE_API_BASE_URL: ${EASYTRADE_API_BASE_URL:-}
  EASYTRADE_WEBHOOK_SECRET: ${EASYTRADE_WEBHOOK_SECRET:-}
  PARASUT_BASE_URL: ${PARASUT_BASE_URL:-}
  PARASUT_CLIENT_ID: ${PARASUT_CLIENT_ID:-}
  PARASUT_CLIENT_SECRET: ${PARASUT_CLIENT_SECRET:-}
  PARASUT_REDIRECT_URL: ${PARASUT_REDIRECT_URL:-}
  BANK_EGRESS_IPS: ${BANK_EGRESS_IPS:-}
  BANK_TECH_CONTACT: ${BANK_TECH_CONTACT:-}
  AI_PROVIDER: ${AI_PROVIDER:-anthropic}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
  AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
  AI_FALLBACK_BASE_URL: ${AI_FALLBACK_BASE_URL:-}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  AI_MASKING: ${AI_MASKING:-true}
  AI_DISABLE_PROVIDER_STORE: ${AI_DISABLE_PROVIDER_STORE:-true}
  AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
  AI_IMAGE_REDACTION: ${AI_IMAGE_REDACTION:-required}
  AI_OCR_TESSERACT_PATH: ${AI_OCR_TESSERACT_PATH:-tesseract}
  AI_OCR_LANG: ${AI_OCR_LANG:-tur}
  MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-App}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-auto}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
  SMTP_TLS_INSECURE_SKIP_VERIFY: ${SMTP_TLS_INSECURE_SKIP_VERIFY:-false}
  QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
  QUEUE_WORKER_INPROCESS: "false"
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-10}
  # Sabit çıkış IP'si (issue #45). WORKER_POOL: all | general | fixed-egress.
  # worker-egress profili açılınca ana worker'da WORKER_POOL=general yapın.
  WORKER_POOL: ${WORKER_POOL:-all}
  # Varsayılan: yığındaki egress-proxy (issue #256). Boş değer vekili kapatır
  # (çağrılar doğrudan çıkar); başka bir sabit IP'li vekil de verilebilir.
  EGRESS_PROXY_URL: ${EGRESS_PROXY_URL-http://egress-proxy.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:3128}
  EGRESS_PROXY_HOSTS: *egress-proxy-hosts
  EGRESS_EXPECTED_IPS: ${EGRESS_EXPECTED_IPS:-}
  EGRESS_IP_CHECK_URL: ${EGRESS_IP_CHECK_URL:-https://api.ipify.org}
  EGRESS_CHECK_INTERVAL: ${EGRESS_CHECK_INTERVAL:-15m}
  BULK_SYNC_MAX: ${BULK_SYNC_MAX:-}
  BULK_ROLLBACK_HOURS: ${BULK_ROLLBACK_HOURS:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@example.com}
  SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
  SEARCH_DRIVER: ${SEARCH_DRIVER:-meilisearch}
  MEILI_HOST: http://meilisearch.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
  MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-app}
  # --- Tenancy (organizations). Off = single-scope app. ---
  TENANCY_ENABLED: ${TENANCY_ENABLED:-true}
  TENANCY_SELF_SERVE: ${TENANCY_SELF_SERVE:-false}
  TENANCY_CACHE_TTL: ${TENANCY_CACHE_TTL:-60s}
  TENANCY_INVITE_TTL: ${TENANCY_INVITE_TTL:-168h}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # --- Mobile app (all optional; empty = feature off / defaults) ---
  AUTH_REVIEW_ACCOUNTS: ${AUTH_REVIEW_ACCOUNTS:-}
  AUTH_APPLE_NATIVE_CLIENT_IDS: ${AUTH_APPLE_NATIVE_CLIENT_IDS:-}
  AUTH_GOOGLE_NATIVE_CLIENT_IDS: ${AUTH_GOOGLE_NATIVE_CLIENT_IDS:-}
  # Sign in with Apple key fallback. Prefer uploading the .p8 in Platform →
  # Integrations → Apple (stored encrypted in the DB, wins over these).
  AUTH_APPLE_TEAM_ID: ${AUTH_APPLE_TEAM_ID:-}
  AUTH_APPLE_KEY_ID: ${AUTH_APPLE_KEY_ID:-}
  AUTH_APPLE_PRIVATE_KEY: ${AUTH_APPLE_PRIVATE_KEY:-}
  AUTH_QR_TRUST_GEO_HEADERS: ${AUTH_QR_TRUST_GEO_HEADERS:-false}
  AUTH_QR_GEOIP_DB: ${AUTH_QR_GEOIP_DB:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  # ClickFix destek widget'ı (#387): ofis panelindeki kullanıcıyı doğrulanmış
  # tanıtan user_hash anahtarı. Boş = kullanıcı doğrulanmamış ziyaretçi.
  CLICKFIX_IDENTITY_SECRET: ${CLICKFIX_IDENTITY_SECRET:-}
  # --- Error tracking (Sentry protocol, self-hosted). Empty DSN = off. ---
  # Dokploy env is shared by every service, so the backend DSN has its own name.
  SENTRY_DSN: ${BACKEND_SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # Share of HTTP requests sent as performance transactions (0 = off).
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  # --- Metrics and tracing (#179). Metrics listen on their own port inside
  # the compose network (not published); scrape backend:9091 and worker:9092.
  METRICS_ADDR: ${METRICS_ADDR:-:9091}
  WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9092}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # OpenTelemetry: empty endpoint = tracing off. Other OTEL_EXPORTER_OTLP_*
  # variables (headers, protocol) are read by the exporter.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-postgres
    restart: unless-stopped
    environment:
      # The cluster's superuser, created at first start (#317). After the owner
      # change (docs/runbook/db-sahip-gecisi.md) DB_USER is hakan_owner and
      # DB_ADMIN_USER keeps the original superuser; empty = DB_USER.
      POSTGRES_USER: ${DB_ADMIN_USER:-${DB_USER:?DB_USER is required}}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  seaweedfs:
    # S3-compatible object store (MinIO community images are archived), used
    # through the unchanged S3 driver. Anonymous requests are denied: the only
    # identity is the backend's credentialed one.
    image: chrislusf/seaweedfs:4.48
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-seaweedfs
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        # Capacity (#247): smaller volumes leave less unusable space per volume
        # when the disk fills; -volume.max=0 sizes the count to the free disk.
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB="$$SEAWEEDFS_VOLUME_SIZE_MB" -volume.max="$$SEAWEEDFS_VOLUME_MAX" -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      SEAWEEDFS_VOLUME_SIZE_MB: ${SEAWEEDFS_VOLUME_SIZE_MB:-256}
      SEAWEEDFS_VOLUME_MAX: ${SEAWEEDFS_VOLUME_MAX:-0}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Private: never attach SeaweedFS to dokploy-network or publish its ports.
    # Only the S3 gateway (8333) checks credentials; master/volume/filer
    # (9333/8080/8888) are unauthenticated and reachable by every container on
    # the app network, so keep that network to this app's own services.
    networks:
      - app

  seaweedfs-init:
    # Creates the bucket (idempotent) before the backend's boot-time HeadBucket.
    image: chrislusf/seaweedfs:4.48
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        run() { printf '%s\n' "$$1" | weed shell -master="seaweedfs.$$APP_NETWORK:9333" -filer="seaweedfs.$$APP_NETWORK:8888"; }
        for _ in $$(seq 1 30); do
          # Re-runs fail with "already exists"; only the list check decides.
          run "s3.bucket.create -name $$S3_BUCKET" >/dev/null 2>&1 || true
          # Exact first-column match on stdout only: connection errors (which
          # contain the network name) and similar buckets must not pass.
          if run "s3.bucket.list" 2>/dev/null | awk -v b="$$S3_BUCKET" '$$1 == b { f = 1 } END { exit !f }'; then
            echo "bucket $$S3_BUCKET ready"
            exit 0
          fi
          sleep 2
        done
        echo "bucket $$S3_BUCKET could not be created" >&2
        exit 1
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      APP_NETWORK: ${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
    restart: "no"
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves localhost to ::1; Meili listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-centrifugo
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?CENTRIFUGO_ALLOWED_ORIGINS is required}
    volumes:
      - ./deploy/centrifugo/config.prod.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--address=http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app
      - dokploy-network

  # Egress vekili (issue #256): İşNet ve Vakıfbank yalnızca izin listesindeki
  # sabit IP'den gelen çağrıyı kabul ediyor. Backend ve worker bu hostlara
  # buradan çıkar (EGRESS_PROXY_URL, EGRESS_PROXY_HOSTS); vekil yalnızca
  # EGRESS_PROXY_HOSTS'taki hostlara HTTPS CONNECT verir, gerisini 403 ile
  # reddeder. Çıkış IP'si bu sunucunun IP'sidir: entegratöre ve bankaya
  # bildirilen IP budur (docs/deploy.md, "Sabit çıkış IP'si").
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-egress-proxy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/hakan/start.sh"]
    environment:
      EGRESS_PROXY_HOSTS: *egress-proxy-hosts
    volumes:
      - ./deploy/egress-proxy/squid.conf:/etc/squid/hakan.conf:ro
      - ./deploy/egress-proxy/start.sh:/hakan/start.sh:ro
    expose:
      - "3128"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app

  migrate:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-migrate
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:5432/${DB_NAME:?DB_NAME is required}?sslmode=${DB_SSLMODE:-disable}
      APP_ROLE: migrate
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  backend:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-backend
    environment:
      <<: *backend-environment
      APP_ROLE: server
      AUTO_MIGRATE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      # /healthz, not /readyz: a Postgres/Redis blip must not mark the API
      # unhealthy (unhealthy containers are dropped by the proxy).
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    # App network only: the frontend proxies /api, so the API needs no public
    # domain, and on dokploy-network its `backend` alias would answer other
    # stacks' lookups.
    networks:
      - app

  worker:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-worker
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  # Sabit çıkış IP'li worker havuzu (issue #45, D4). Entegratör ve banka
  # çağrıları "fixed-egress" kuyruğunda yalnızca bu serviste çalışır ve
  # entegratörün allowlist'indeki IP'den çıkar. İki kurulum yolu var:
  #   1. Bu servisi çıkış IP'si sabit bir sunucuda çalıştırın (Dokploy uzak
  #      sunucu / ayrı node), EGRESS_PROXY_URL boş kalsın.
  #   2. Bu sunucuda çalıştırın, çağrılar sabit IP'li bir ileri vekilden
  #      çıksın. Varsayılan, yığındaki egress-proxy (#256); başka bir vekil
  #      için EGRESS_PROXY_URL=http://...
  # İki durumda da EGRESS_EXPECTED_IPS'e allowlist'teki IP'yi yazın; IP
  # değişirse egress denetimi düşer (log + Sentry) ve
  # GET /v1/platform/egress durumu gösterir.
  # Açmak için: COMPOSE_PROFILES=fixed-egress ve ana worker'da
  # WORKER_POOL=general.
  worker-egress:
    <<: *backend-image
    profiles: ["fixed-egress"]
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-worker-egress
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
      WORKER_POOL: fixed-egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  # Scheduled encrypted backups (#178, docs/yedekleme.md): pg_dump + roles and
  # the object store bucket, age-encrypted to BACKUP_AGE_RECIPIENTS (public
  # keys only; the private key stays offline), kept BACKUP_RETENTION_DAYS in
  # the backups volume and optionally copied off-site. Without recipients it
  # writes nothing and stays unhealthy (it never blocks the deploy).
  backup:
    image: ${BACKUP_IMAGE:?BACKUP_IMAGE is required}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
      PGPORT: "5432"
      # Yedek rolü (#312, scripts/db-roles.sql): hakan_backup yalnızca okur ve
      # RLS'yi atlar. Boşsa veritabanı sahibi (DB_USER) kullanılır; sahip süper
      # kullanıcı değilse pg_dump FORCE'lu tablolarda hata verir.
      PGUSER: ${DB_BACKUP_USER:-${DB_USER:?DB_USER is required}}
      PGPASSWORD: ${DB_BACKUP_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
      S3_ENDPOINT: http://seaweedfs.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-17 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OBJECTS: ${BACKUP_OBJECTS:-true}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      # Optional off-site copy (any S3-compatible store); empty bucket = off.
      BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:-}
      BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:-}
      BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:-}
      BACKUP_OFFSITE_S3_ACCESS_KEY: ${BACKUP_OFFSITE_S3_ACCESS_KEY:-}
      BACKUP_OFFSITE_S3_SECRET_KEY: ${BACKUP_OFFSITE_S3_SECRET_KEY:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - app

  frontend:
    <<: *frontend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-frontend
    environment:
      API_URL: http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8080/v1
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:-}
      NEXT_PUBLIC_BFF_BASE_URL: ${NEXT_PUBLIC_BFF_BASE_URL:-/api}
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-true}
      NEXT_PUBLIC_CENTRIFUGO_URL: ${NEXT_PUBLIC_CENTRIFUGO_URL:-}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_FALLBACK_LOCALE: ${NEXT_PUBLIC_FALLBACK_LOCALE:-en}
      # ClickFix destek widget'ı (#387): çalışma anında /api/client-env ile
      # tarayıcıya gider. Kimlik boş = widget yüklenmez.
      NEXT_PUBLIC_CLICKFIX_WIDGET_ID: ${NEXT_PUBLIC_CLICKFIX_WIDGET_ID:-}
      NEXT_PUBLIC_CLICKFIX_TAXPAYER_WIDGET_ID: ${NEXT_PUBLIC_CLICKFIX_TAXPAYER_WIDGET_ID:-}
      NEXT_PUBLIC_CLICKFIX_SCRIPT_URL: ${NEXT_PUBLIC_CLICKFIX_SCRIPT_URL:-https://getclickfix.com/widget.js}
      # WhatsApp uzantısı (#780): mağaza kimliği (paketlenmemiş kimlik koddadır)
      # ve Chrome Web Mağazası bağlantısı. Boş = yalnızca zip.
      NEXT_PUBLIC_WHATSAPP_EXTENSION_IDS: ${NEXT_PUBLIC_WHATSAPP_EXTENSION_IDS:-}
      NEXT_PUBLIC_WHATSAPP_STORE_URL: ${NEXT_PUBLIC_WHATSAPP_STORE_URL:-}
      # Error tracking, read at runtime by the Next.js server/edge and served
      # to the browser by /api/client-env (no build arg). Empty = off.
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      # Real route is /health (not /api/v1/health). Unhealthy containers are
      # dropped by Traefik → domain returns "404 page not found".
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - app
      - dokploy-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-redis}
  seaweedfs_data:
    name: ${SEAWEEDFS_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-seaweedfs}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-meilisearch}
  backups_data:
    name: ${BACKUPS_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-backups}

networks:
  # Created by Compose for this app only.
  app:
    name: ${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
    driver: bridge
  # Dokploy's shared proxy network (external). deploy/compose.prod.yml sets
  # PROXY_NETWORK_EXTERNAL=false so a plain host without Dokploy creates it.
  dokploy-network:
    name: ${PROXY_NETWORK_NAME:-dokploy-network}
    external: ${PROXY_NETWORK_EXTERNAL:-true}
