openapi: 3.1.0
info:
  title: App API
  version: 0.1.0
  summary: Boilerplate HTTP API — auth, RBAC, users, roles, notifications, realtime
  description: |
    Starter HTTP API for the Next.js + Go boilerplate.

    **In scope:** authentication, global RBAC, platform users/roles, notifications,
    Web Push (VAPID), passkeys, Centrifugo realtime tokens, and organizations
    (tenant core: `/v1/tenant/*` with the `X-Organization` header).

    **Out of scope:** CRM, inbox, commerce, AI, tickets, reports.
    Those product modules were stripped. Live Go routes (`internal/modules/**/routes.go`)
    are the source of truth if a path below is missing from the router.

    **Roles:**
    - `super_admin` — system role; assigned via `make create-super-admin`
    - `cms_user` — seed role for CMS access
    - Custom roles via `/v1/platform/roles`

    **Auth:** Bearer JWT access tokens + opaque refresh tokens.
    See `docs/auth.md` for the permission matrix and token claims.
    Error catalog: `docs/api/errors.md`.

    **Conventions:**
    - Success/error envelope: `{success,data|error,meta.request_id}` on all `/v1/*`.
    - Lists: `{items,total,limit,offset}` under `data` (`limit`/`offset`/`q`/`sort`; never `page`/`search`).
    - Probes `/healthz` and `/readyz` are **not** enveloped.
    - See `API_CONVENTIONS.md` and `docs/api/errors.md`.
  contact:
    name: App
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: Billing
    description: Ofis faturalama (D9, D14)
  - name: Sources
    description: Ön muhasebe programı bağlantıları (Paraşüt …)
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Register, login, tokens, sessions, profile
  - name: Search
    description: Command-palette search (Meilisearch-backed record lookup)
  - name: Platform
    description: Super-admin platform tenant/user catalog
  - name: Tenant
    description: Organization-scoped routes (`X-Organization` header; `TENANCY_ENABLED`)
  - name: Engagements
    description: Ofis <-> mükellef hizmet ilişkisi ve üye atamaları (`X-Organization`; `TENANCY_ENABLED`)
  - name: Invoices
    description: Mükellef faturaları; UBL / ZIP yükleme (aktif engagement)
  - name: AI
    description: AI module (office cost report, provider privacy statement)
  - name: Taxpayers
    description: Global mükellef kimliği (VKN/TCKN). Platform kataloğu ve engagement üzerinden ofis görünümü.
  - name: TaxpayerOnboarding
    description: |
      Mükellef ekleme (issue #7, D1b). Ofis VKN/TCKN ve iletişim bilgisini
      girer; yanıt her durumda aynıdır ve aynı sürede döner. Engagement
      yalnızca mükellef onaylayınca açılır.
  - name: OfficeTransfer
    description: |
      Ofis geçişi (issue #8, D2). Geçmiş veri yeni ofise yalnızca mükellefin
      (sahibinin) onayıyla açılır; onay saklanır ve geri alınabilir. Eski
      ofis geçişten sonraki belgeleri görmez.
  - name: Petitions
    description: |
      Dilekçe üretimi (issue #56). Şablonlar kodda; hiçbiri hukuki kontrolden
      geçmedi, hepsi taslak (`draft: true`) ve önizleme ile PDF bunu yazar.
  - name: TaxpayerPortal
    description: Mükellef kullanıcıları (ofis daveti, `X-Taxpayer` başlığı ile mükellef kabuğu). `TENANCY_ENABLED`.
  - name: Warnings
    description: Warning engine (05-uyari-kodlari.md) rule configuration and warnings
  - name: Review
    description: Review queue (suggestions, provenance, decisions, thresholds)
  - name: ExcelImports
    description: Excel / CSV import (04-excel-ice-aktarma.md)
  - name: Receipts
    description: Receipt capture (OCR drafts, vehicle list, plate check)
  - name: Legal
    description: KVKK texts (versioned) and acceptance records
  - name: Agents
    description: Desktop local agents (registration, heartbeat, AGENT_OFFLINE)
  - name: Summaries
    description: AI period summary drafts (numbers backed by portal data)
  - name: Realtime
    description: Centrifugo connection and subscription tokens
  - name: Notifications
    description: In-app notification center, preferences, and admin send

  - name: AccountPlan
    description: Target account plan (Luca hesap planı / mizan import, ACCOUNT_NOT_IN_TARGET_PLAN check)
  - name: Periods
    description: Dönem yönetimi (hazırlık durumu, dönem kilidi, kilitli döneme gelen değişiklik talepleri, mükellef × dönem matrisi)
  - name: DocumentTasks
    description: Eksik belge görevleri (bankada var, belgesi yok → mükellefe görev → yükleme → eşleşme)
  - name: AccountRules
    description: Account code rules (versioned office template and engagement rules, suggestions, rule candidates)
  - name: VAT
    description: KDV erken uyarı (dönem içi tahmin, devreden KDV, beyan takvimi; docs/00 K9 T10)
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Process is alive. Does not check dependencies.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Pings Postgres and Redis. Returns 200 when both are up, 503 otherwise.
        Object storage is a soft check (logged only).
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: postAuthRegister
      summary: Self-serve user register
      description: |
        Creates a global user account and returns it. Tokens are issued on login.

        Invitation sign-up: with `invitation_token`, the invited address can
        register while public registration is off (`TENANCY_ENABLED=true`). The
        emailed token proves the mailbox, so the email is verified. No default
        role is assigned and the invitation is not consumed: accept it with
        `/v1/invitations/accept`. Errors: `404 INVITATION_NOT_FOUND`,
        `410 INVITATION_UNAVAILABLE` (used, revoked or expired),
        `403 INVITATION_EMAIL_MISMATCH`, `403 FORBIDDEN` (password sign-in
        disabled; use the email-code flow), `409 CONFLICT` (account exists).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegister"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`INVITATION_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: "`INVITATION_UNAVAILABLE`: already used, revoked or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Login
      description: |
        Authenticates with email/password and returns a token pair.
        A self-deleted account returns `403 ACCOUNT_DEACTIVATED` (after the
        password is verified); `/v1/auth/refresh` and every other sign-in path
        do the same.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: postAuthRefresh
      summary: Refresh tokens
      description: Rotates an opaque refresh token and returns a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: Logout
      description: Revokes the given refresh token. Requires a valid access JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Current session
      description: Hydrates the authenticated user, roles, permissions, and tenant memberships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search/specs:
    get:
      tags: [Search]
      operationId: getSearchSpecs
      summary: Searchable resource specs
      description: Returns Meilisearch-backed specs visible to the caller (permission-filtered).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Spec catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchSpecs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search:
    get:
      tags: [Search]
      operationId: getSearch
      summary: Search indexed records
      description: Typo-tolerant search across allowed specs. Use `q` (not `search`). Optional `spec` scopes to one resource.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: spec
          in: query
          schema:
            type: string
            example: users
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchHits"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up:
    get:
      tags: [Auth]
      operationId: getAuthStepUp
      summary: Step-up grant status
      description: Returns whether the caller has a recent step-up grant and enabled verification methods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Step-up status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/password:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPassword
      summary: Verify password for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasswordRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/options:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyOptions
      summary: Begin passkey step-up assertion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/verify:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyVerify
      summary: Finish passkey step-up assertion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/totp:
    post:
      tags: [Auth]
      operationId: postAuthStepUpTOTP
      summary: Verify authenticator code for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp:
    get:
      tags: [Auth]
      operationId: getAuthTOTP
      summary: Authenticator 2FA status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/setup:
    post:
      tags: [Auth]
      operationId: postAuthTOTPSetup
      summary: Begin authenticator 2FA setup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: postAuthTOTPConfirm
      summary: Confirm authenticator 2FA setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Confirmed with recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPConfirm"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: postAuthTOTPDisable
      summary: Disable authenticator 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/access/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAccessSettings
      summary: Read step-up policy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAccessSettings
      summary: Update step-up policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStepUpPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/github:
    get:
      tags: [Platform]
      operationId: getPlatformGitHubIntegrationSettings
      summary: Read GitHub App integration settings
      description: Super admin only. Secrets are never returned; only configured flags.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformGitHubIntegrationSettings
      summary: Update GitHub App integration settings
      description: Super admin only. Omit blank secret fields to keep existing values.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGitHubIntegrationSettingsRequest"
      responses:
        "200":
          description: Updated GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/system/info:
    get:
      tags: [Platform]
      operationId: getPlatformSystemInfo
      summary: Read system runtime metrics, infrastructure health, and environment diagnostics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System runtime info and health diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/system/ping:
    post:
      tags: [Platform]
      operationId: pingPlatformSystem
      summary: Trigger a live health and latency probe across all backing services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/settings:
    get:
      tags: [Platform]
      operationId: getPlatformSettings
      summary: Read app branding / letterhead settings (app_settings singleton)
      description: Requires `platform.settings.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: App settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAppSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformSettings
      summary: Partially update app branding / letterhead settings
      description: Requires `platform.settings.write`. Omitted fields are left unchanged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAppSettingsRequest"
      responses:
        "200":
          description: Updated app settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAppSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/settings/logo:
    get:
      tags: [Platform]
      operationId: getPlatformSettingsLogo
      summary: Stream the app logo image
      description: Any authenticated user. Returns the raw image bytes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logo image
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Platform]
      operationId: putPlatformSettingsLogo
      summary: Upload or replace the app logo
      description: Requires `platform.settings.write`. Multipart form with a `logo` file field.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        "200":
          description: Updated app settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAppSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Platform]
