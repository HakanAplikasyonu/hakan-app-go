        "422":
          description: "`INVALID_BILLING_INPUT`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/platform/organizations/{uuid}/billing/statements:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Billing]
      operationId: generateBillingStatement
      summary: Compute the statement draft of a month
      description: |
        Requires `platform.organizations.write`. Counts the month's active
        taxpayers (an engagement of the office active on any day of the
        month, Türkiye time, each taxpayer once) and prices them with the
        office's plan. Recomputing replaces a draft; a final or void
        statement answers `409 BILLING_STATEMENT_FINAL`. No collection (D14).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "2026-10" }
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBillingStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

