  /v1/taxpayer-invitations/accept:
    post:
      tags: [TaxpayerPortal]
      operationId: acceptTaxpayerInvitation
      summary: Accept a mükellef invitation
      description: |
        The signed-in account's email must be the invited address. Creates the
        `taxpayer_members` row and consumes the invitation (single use). New
        users sign up first: the registration endpoints accept a mükellef
        invitation token like an office one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAcceptedTaxpayerInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`INVITATION_EMAIL_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`INVITATION_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`ALREADY_MEMBER`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: "`INVITATION_UNAVAILABLE` (used, revoked, expired or engagement ended)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

