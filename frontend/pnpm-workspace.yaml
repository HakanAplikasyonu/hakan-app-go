packages:
  - "."

allowBuilds:
  protobufjs: false
  sharp: true
  unrs-resolver: true

# Security floor for transitive dependencies (#192, docs/guvenlik-taramalari.md).
# Remove an entry once the parent package ships the fixed version itself.
overrides:
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=5.0.0 <5.0.11: ^5.0.11
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2

# Düzeltmesi yayımlanmamış açıklar için gerekçeli ve süreli yok sayma
# (docs/guvenlik-taramalari.md, "audit"). Düzeltme çıkınca satır silinip
# yukarıdaki overrides'a taban sürüm eklenir.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 extglob ReDoS; npm'de 4.0.8 yok. Son tarih: 2026-12-18.
    - GHSA-fc5q-39xc-vjpf
