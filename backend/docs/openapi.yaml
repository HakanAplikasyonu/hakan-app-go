        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/BankService" } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    BankConnection:
      type: object
      required: [uuid, bank_id, bank_name, environment, setup_state, status, ibans, has_credentials, credential_fields, created_at]
      properties:
        uuid: { type: string, format: uuid }
        bank_id: { type: string }
        bank_name: { type: string }
        environment: { type: string, enum: [production, test] }
        setup_state:
          type: string
          enum: [draft, form_ready, submitted_to_bank, credentials_entered, verifying, active, failed]
        status: { type: string, enum: [pending, active, auth_failed, rate_limited, disabled] }
        ibans: { type: array, items: { type: string } }
        has_credentials: { type: boolean }
        error:
          type: object
          required: [reason, message, at]
          properties:
            reason: { type: string, description: "ip_rejected, unauthorized, bad_credentials, instruction_missing, account_not_defined, bank_error, rate_limited, invalid_request, tax_id_mismatch" }
            code: { type: string, description: "The bank's own code (e.g. VBH0009)" }
            message: { type: string }
            at: { type: string, format: date-time }
        credential_fields: { type: array, items: { $ref: "#/components/schemas/BankCredentialField" } }
        submitted_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
        last_sync_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    EnvelopeBankConnection:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BankConnection" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeBankConnectionList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
