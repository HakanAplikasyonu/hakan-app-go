    post:
      tags: [ExcelImports]
      operationId: uploadExcelImport
      summary: Upload an Excel / CSV export
      description: |
        Requires `tenant.excel_imports.write`, `tenant.engagements.read` and engagement access. xlsx or csv (; or , separated, UTF-8 or Windows-1254), max 20 MB / 100000 rows. Analysis runs at once: a matching template (company > tenant > global) maps the columns without AI; otherwise the AI maps a masked sample (columns under 0.80 confidence go to mapping_review); without AI the mapping is manual.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                data_type: { type: string, enum: [outgoing_invoices, incoming_invoices] }
                source_system: { type: string, example: bizimhesap }
                period: { type: string, example: "2026-10" }
                sheet: { type: string }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExcelImport"
