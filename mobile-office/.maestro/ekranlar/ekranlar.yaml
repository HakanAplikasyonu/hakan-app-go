# Ekran görüntüleri (#332): ana ekranlar, CI'da açık ve koyu sistem temasında
# (scripts/maestro-ci.sh, TEMA=light|dark). Duman akışlarından ayrı klasörde:
# test değil, artifact üretir. Görüntüler Maestro'nun çalışma klasörüne
# (maestro-out/screenshots) yazılır.
appId: app.hakan.office
name: ekranlar
env:
  TEMA: light
---
- launchApp:
    clearState: true
- assertVisible: "Giriş yap"
- takeScreenshot: ofis-${TEMA}-00-giris
- runFlow: ../flows/login.yaml
- runFlow: ../flows/select-office.yaml
- assertVisible:
    id: "period-crown"
- takeScreenshot: ofis-${TEMA}-01-pano
- tapOn:
    id: "tab-review"
- extendedWaitUntil:
    visible:
      id: "suggestion-card|review-remaining"
    timeout: 20000
- takeScreenshot: ofis-${TEMA}-02-onay
- tapOn:
    id: "tab-clients"
- assertVisible:
    id: "clients-search"
- takeScreenshot: ofis-${TEMA}-03-mukellefler
- tapOn:
    id: "tab-tasks"
- takeScreenshot: ofis-${TEMA}-04-gorevler
- tapOn:
    id: "tab-notifications"
- assertVisible: "Bildirimler"
- takeScreenshot: ofis-${TEMA}-05-bildirimler
- openLink: "hakanofis://warnings"
- assertVisible: "Uyarılar"
- takeScreenshot: ofis-${TEMA}-06-uyarilar
- back
