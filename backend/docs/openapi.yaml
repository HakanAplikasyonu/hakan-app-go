      - $ref: "#/components/parameters/EngagementUuid"
      - { name: invoiceUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AccountRules]
      operationId: suggestInvoiceAccounts
      summary: Suggest account codes for an invoice
      description: |
        Requires `tenant.review.decide`. Runs the rules for every line (line and VAT account) and the counterparty (cari account, found by name in the target plan or proposed under 120 / 320) and submits each to the review queue (kind `account_code`) with confidence, rationale and provenance (`rule_ref` = rule version, `history:counterparty` or `global:*`). Suggestions at or above the threshold are applied at once. Fields that already have a code are skipped.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeAccountSuggestionList" }
