  /v1/platform/taxpayers:
    get:
      tags: [Taxpayers]
      operationId: getPlatformTaxpayers
      summary: List taxpayer identities
      description: Requires `platform.taxpayers.read`. `q` matches an exact VKN/TCKN or part of the title.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Taxpayer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayerPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Taxpayers]
      operationId: postPlatformTaxpayer
      summary: Register a taxpayer identity
      description: |
        Requires `platform.taxpayers.write`. VKN (10 digits) and TCKN
        (11 digits) are checked with their check-digit algorithms. A legal
        entity needs a VKN. A VKN/TCKN exists once on the platform: a second
        registration answers `409 TAXPAYER_ALREADY_EXISTS`. This answer is
        platform-only; office routes never reveal whether a tax id exists (D1b).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxpayerRequest"
      responses:
        "201":
          description: Created taxpayer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaxpayer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

