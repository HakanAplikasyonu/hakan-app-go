<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ofis kenar menüsü</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hakan.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="side hk" aria-label="Ofis menüsü" style="height:100%;min-height:1000px;width:240px;font-family:Inter,sans-serif;color:var(--text)">
  <div class="row" style="gap:10px;padding:4px 8px 14px">
    <svg viewBox="0 0 181 198" width="22" height="24" aria-hidden="true"><polygon points="0,86 28,59 28,198 0,198" style="fill:var(--c-light)"></polygon><polygon points="28,59 56,86 56,198 28,198" style="fill:var(--c-mid)"></polygon><polygon points="63,36 91,0 91,198 63,198" style="fill:var(--c-mid)"></polygon><polygon points="91,0 119,36 119,198 91,198" style="fill:var(--c-dark)"></polygon><polygon points="125,86 153,59 153,198 125,198" style="fill:var(--c-dark)"></polygon><polygon points="153,59 181,86 181,198 153,198" style="fill:var(--c-light)"></polygon></svg>
    <span style="font:800 21px/1 'Inter Tight',sans-serif;letter-spacing:-.05em">hakan</span>
  </div>
  <button type="button" class="row" style="gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:12px;cursor:pointer;font:inherit;color:inherit;text-align:left">
    <span class="av av-sq" style="width:28px;height:28px;font-size:11px;background:var(--text);color:var(--bg)">DM</span>
    <span class="col grow"><span class="t-sm t-b" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Demir Mali Müşavirlik</span><span class="t-xs t-3">38 mükellef</span></span>
    <svg class="ic ic-sm t-3" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
  </button>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div class="t-cap" style="padding:14px 10px 6px;font-size:10px">{{g.title}}</div>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
      <a href="{{it.href}}" class="{{it.cls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.d}}"></path></svg>{{it.label}}<span class="cnt">{{it.cnt}}</span></a>
    </sc-for>
  </sc-for>
  <div style="flex:1"></div>
  <div class="card" style="padding:12px;margin-bottom:10px;background:var(--surface-2)">
    <div class="row t-xs"><span class="dot" style="color:var(--ok)"></span><b>2 ajan çevrimiçi</b><span class="t-3" style="margin-left:auto">1 kapalı</span></div>
  </div>
  <div class="row" style="gap:10px;padding:8px">
    <span class="av">MD</span><span class="col grow"><span class="t-sm t-b">Mert Demir</span><span class="t-xs t-3">Sahip · SMMM</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aktif":{"editor":"enum","options":["pano","komuta","kuyruk","mukellef","belge","mizan","uyari","luca","ajan","ayar"],"default":"pano"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.aktif ?? 'pano';
    const I = {
      pano:'M4 20V11l3-3 3 3v9M10 20V7l3-4 3 4v13M16 20v-9l3-3 3 3v9',
      komuta:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      kuyruk:'M3 13l2.5-8h13L21 13v6H3zM3 13h5l1.5 2.5h5L16 13h5',
      mukellef:'M16 20v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 18.5V20M10 11.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7M20 20v-1.5a3.5 3.5 0 00-2.5-3.35',
      belge:'M6 3h9l4 4v14l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2L6 21zM9 9h6M9 13h6',
      mizan:'M12 3v18M5 7h14M5 7l-3 7a3.5 3.5 0 006 0zM19 7l-3 7a3.5 3.5 0 006 0z',
      uyari:'M12 3l9.5 17h-19zM12 10v4M12 17h.01',
      luca:'M5 21h14M12 3v12M7 10l5 5 5-5',
      ajan:'M3 5h18v11H3zM8 20h8M12 16v4',
      ayar:'M12 15a3 3 0 100-6 3 3 0 000 6M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4'
    };
    const it = (k,label,href,cnt) => ({label, href, cnt: cnt || '', d: I[k], cls: k===a ? 'nav on' : 'nav'});
    const groups = [
      {title:'Bugün', items:[it('pano','Genel bakış','OfisPano.dc.html'), it('kuyruk','İnceleme kuyruğu','OfisKuyruk.dc.html','124'), it('uyari','Uyarılar','OfisUyarilar.dc.html','6')]},
      {title:'Kayıtlar', items:[it('mukellef','Mükellefler','OfisMukellefler.dc.html','38'), it('belge','Faturalar ve fişler','OfisBelgeler.dc.html'), it('mizan','Mizan hafızası','OfisMizan.dc.html'), it('luca','Yevmiye ve çıktı','OfisLuca.dc.html')]},
      {title:'Ofis', items:[it('komuta','Komuta merkezi','OfisPano.dc.html'), it('ajan','Masaüstü ajanları','OfisAyarlar.dc.html'), it('ayar','Ayarlar','OfisAyarlar.dc.html')]}
    ];
    return { groups };
  }
}
</script>
</body>
</html>
