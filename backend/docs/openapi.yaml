  /v1/taxpayer/history-shares:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
    get:
      tags: [OfficeTransfer]
      operationId: getTaxpayerHistoryShares
      summary: The company's history-sharing consents
      description: Owners only. Newest first; revoked records stay listed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHistoryShareList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [OfficeTransfer]
      operationId: postTaxpayerHistoryShare
      summary: Share data from before the current office
      description: |
        Owners only. Opens documents dated before the current (active)
        engagement started to that office, optionally within
        `from_date`..`to_date` (inclusive, YYYY-MM-DD). `409` when the
        company has no active office.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHistoryShareRequest"
      responses:
        "201":
          description: Consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHistoryShare"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer/history-shares/{uuid}:
    parameters:
      - $ref: "#/components/parameters/XTaxpayer"
      - $ref: "#/components/parameters/ResourceUUID"
    delete:
      tags: [OfficeTransfer]
      operationId: deleteTaxpayerHistoryShare
      summary: Take a consent back
      description: Owners only. The office loses the shared period at once; the record stays.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/taxpayer-invitations/preview:
    post:
      tags: [TaxpayerPortal]
      operationId: previewTaxpayerInvitation
      summary: Describe a mükellef invitation link
      description: |
        Public; the token travels in the body. An invitation whose engagement
        has ended reads as `revoked`. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
