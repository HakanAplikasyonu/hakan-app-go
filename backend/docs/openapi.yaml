    put:
      tags: [Billing]
      operationId: setOrganizationBilling
      summary: Set an office's plan and read-only mode
      description: |
        Requires `platform.organizations.write`. `read_only: true` is the
        AccessPolicy of G7: the office keeps reading, every write under
        `/v1/tenant/*` answers `403 ORGANIZATION_READ_ONLY` with the reason.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
